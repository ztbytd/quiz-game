services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: zhixu
      POSTGRES_DB: zhixu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - zhixu-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhixu -d zhixu"]
      interval: 10s
      retries: 10
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: Dockerfile.ai
    env_file: server/.env.production.local
    environment:
      SERVICE_ROLE: api
    ports:
      - "127.0.0.1:3100:3100"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/quiz/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      retries: 5
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: Dockerfile.ai
    env_file: server/.env.production.local
    environment:
      SERVICE_ROLE: worker
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  zhixu-postgres:
