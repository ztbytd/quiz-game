<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>面试闯关 · 前端勇士的冒险</title>
<style>
:root {
  --primary: #58cc02; --primary-dark: #46a302; --primary-light: #d7ffb8;
  --blue: #1cb0f6; --blue-dark: #0a92d9; --purple: #ce82ff; --purple-dark: #a860e0;
  --red: #ff4b4b; --red-dark: #e03838; --orange: #ff9600; --gold: #ffc800;
  --bg: #f7f7f7; --card-bg: #fff; --text: #3c3c3c; --text-light: #777;
  --border: #e5e5e5; --shadow: 0 2px 0 rgba(0,0,0,.1); --shadow-lg: 0 4px 0 rgba(0,0,0,.15);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;user-select:none;-webkit-user-select:none}
.top-bar{position:sticky;top:0;z-index:100;background:var(--card-bg);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow)}
.top-bar .title{font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px}
.top-bar .stats{display:flex;gap:16px;align-items:center}
.stat-pill{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px;padding:6px 14px;border-radius:20px;background:#f0f0f0}
.stat-pill.hearts{color:var(--red)} .stat-pill.xp{color:var(--gold)} .stat-pill.streak{color:var(--orange)}
.stat-pill .icon{font-size:18px}
.map-container{max-width:720px;margin:0 auto;padding:32px 20px 100px}
.map-path{display:flex;flex-direction:column;align-items:center}
.level-node{position:relative;margin-bottom:28px;z-index:1}
.level-btn{width:72px;height:72px;border-radius:50%;border:none;cursor:pointer;font-size:28px;font-weight:800;color:#fff;display:flex;align-items:center;justify-content:center;position:relative;transition:transform .15s;box-shadow:var(--shadow-lg)}
.level-btn:hover:not(:disabled){transform:translateY(-2px)}
.level-btn:active:not(:disabled){transform:translateY(2px);box-shadow:var(--shadow)}
.level-btn.completed{background:var(--primary);border-bottom:4px solid var(--primary-dark)}
.level-btn.current{background:var(--gold);border-bottom:4px solid #e0b000;animation:pulse 1.5s ease-in-out infinite}
.level-btn.locked{background:#c8c8c8;border-bottom:4px solid #aaa;cursor:not-allowed;opacity:.6}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.level-btn .star-badge{position:absolute;top:-8px;right:-8px;background:var(--blue);color:#fff;border-radius:12px;padding:2px 8px;font-size:11px;font-weight:800;border:2px solid #fff}
.level-btn .lock-icon{font-size:24px;opacity:.7}
.connector{width:4px;height:24px;background:#ddd;margin:-14px 0 -14px 0;border-radius:2px}
.connector.done{background:var(--primary)}
.level-label{position:absolute;left:90px;top:50%;transform:translateY(-50%);white-space:nowrap}
.level-label .name{font-size:15px;font-weight:800}
.level-label .desc{font-size:12px;color:var(--text-light);margin-top:2px}
.level-label .tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;margin-top:4px}
.tag-easy{background:var(--primary-light);color:var(--primary-dark)}
.tag-medium{background:#fff3d6;color:#c4860a}
.tag-hard{background:#ffe0e0;color:var(--red-dark)}
.tag-boss{background:#f0e0ff;color:var(--purple-dark)}
.level-node:nth-child(even) .level-label{left:auto;right:90px;text-align:right}
.quiz-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.3);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.quiz-overlay.active{display:flex}
.quiz-card{background:var(--card-bg);border-radius:24px;max-width:640px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 8px 30px rgba(0,0,0,.2);animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.quiz-header{padding:16px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.quiz-header .progress-bar{flex:1;height:10px;background:#eee;border-radius:5px;margin-right:16px;overflow:hidden}
.quiz-header .progress-fill{height:100%;background:var(--primary);border-radius:5px;transition:width .3s}
.quiz-header .close-btn{background:none;border:none;font-size:22px;cursor:pointer;color:var(--text-light);padding:4px 8px}
.quiz-body{padding:24px}
.question-type{font-size:12px;font-weight:800;color:var(--blue);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.question-text{font-size:20px;font-weight:700;line-height:1.5;margin-bottom:24px}
.options{display:flex;flex-direction:column;gap:12px}
.option-btn{display:flex;align-items:center;gap:12px;padding:16px 20px;border:2px solid var(--border);border-radius:16px;background:#fff;cursor:pointer;font-size:15px;font-weight:600;color:var(--text);transition:all .15s;text-align:left;line-height:1.4}
.option-btn:hover{border-color:var(--blue);background:#f0faff}
.option-btn .opt-key{width:32px;height:32px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:var(--text-light);flex-shrink:0}
.option-btn.selected{border-color:var(--blue);background:#f0faff}
.option-btn.selected .opt-key{border-color:var(--blue);background:var(--blue);color:#fff}
.option-btn.correct{border-color:var(--primary);background:var(--primary-light)}
.option-btn.correct .opt-key{border-color:var(--primary);background:var(--primary);color:#fff}
.option-btn.wrong{border-color:var(--red);background:#ffe0e0}
.option-btn.wrong .opt-key{border-color:var(--red);background:var(--red);color:#fff}
.text-input{width:100%;padding:16px;border:2px solid var(--border);border-radius:16px;font-size:15px;font-family:inherit;min-height:100px;resize:vertical;transition:border-color .15s;line-height:1.5}
.text-input:focus{outline:none;border-color:var(--blue)}
.true-false{display:flex;gap:12px}
.true-false .option-btn{flex:1;justify-content:center}
.feedback{margin-top:20px;padding:16px 20px;border-radius:16px;display:none}
.feedback.show{display:block;animation:slideUp .2s ease}
.feedback.correct{background:var(--primary-light);border:2px solid var(--primary)}
.feedback.wrong{background:#ffe0e0;border:2px solid var(--red)}
.feedback .result-icon{font-size:20px;font-weight:800;margin-bottom:8px}
.feedback.correct .result-icon{color:var(--primary-dark)}
.feedback.wrong .result-icon{color:var(--red-dark)}
.feedback .explanation{font-size:14px;line-height:1.6}
.feedback .explanation strong{color:var(--text)}
.quiz-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.btn{padding:12px 32px;border:none;border-radius:14px;font-size:15px;font-weight:800;cursor:pointer;transition:transform .1s}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--primary);color:#fff;border-bottom:4px solid var(--primary-dark)}
.btn-primary:hover{background:var(--primary-dark)}
.btn-primary:disabled{background:#ccc;border-bottom-color:#aaa;cursor:not-allowed}
.victory-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:300;display:none;align-items:center;justify-content:center}
.victory-overlay.active{display:flex}
.victory-card{background:#fff;border-radius:24px;padding:40px;max-width:400px;width:90%;text-align:center;animation:bi .5s ease}
@keyframes bi{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
.victory-card .trophy{font-size:64px;margin-bottom:12px;animation:ts .8s ease}
@keyframes ts{0%,100%{transform:rotate(0)}25%{transform:rotate(-15deg)}75%{transform:rotate(15deg)}}
.victory-card h2{font-size:24px;font-weight:800;margin-bottom:8px}
.victory-card .subtitle{font-size:14px;color:var(--text-light);margin-bottom:24px}
.victory-card .rewards{display:flex;justify-content:center;gap:24px;margin-bottom:28px}
.reward-item{display:flex;flex-direction:column;align-items:center;gap:4px}
.reward-item .reward-icon{font-size:32px}
.reward-item .reward-val{font-size:18px;font-weight:800}
.reward-item .reward-label{font-size:11px;color:var(--text-light)}
.achievement-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--purple);color:#fff;padding:12px 24px;border-radius:16px;font-weight:700;font-size:14px;z-index:400;box-shadow:0 4px 16px rgba(0,0,0,.2);display:flex;align-items:center;gap:8px;transition:transform .3s ease}
.achievement-toast.show{transform:translateX(-50%) translateY(0)}
.start-screen{text-align:center;padding:60px 20px;max-width:600px;margin:0 auto}
.start-screen .hero-icon{font-size:72px;margin-bottom:16px;animation:bi .6s ease}
.start-screen h1{font-size:28px;font-weight:800;margin-bottom:8px}
.start-screen .subtitle{font-size:16px;color:var(--text-light);margin-bottom:32px}
.start-screen .player-card{background:#fff;border-radius:20px;padding:24px;box-shadow:var(--shadow);margin-bottom:24px;text-align:left}
.start-screen .player-card .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0f0f0}
.start-screen .player-card .row:last-child{border-bottom:none}
.start-screen .player-card .label{color:var(--text-light);font-size:14px}
.start-screen .player-card .value{font-weight:700;font-size:14px}
.tip-bubble{background:#fff;border:2px solid var(--border);border-radius:16px;padding:14px 18px;font-size:14px;color:var(--text-light);margin:16px 0}
.tip-bubble::before{content:'\1F4A1';margin-right:6px}
@media(max-width:480px){.level-label .desc{display:none}.level-btn{width:60px;height:60px;font-size:22px}.question-text{font-size:17px}.top-bar .title{font-size:15px}.stat-pill{font-size:12px;padding:4px 10px}}
</style>
