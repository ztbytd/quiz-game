<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>面试闯关 · 前端勇士的冒险</title>
<style>
:root {
  --primary: #58cc02; --primary-dark: #46a302; --primary-light: #d7ffb8;
  --blue: #1cb0f6; --blue-dark: #0a92d9; --purple: #ce82ff; --purple-dark: #a860e0;
  --red: #ff4b4b; --red-dark: #e03838; --orange: #ff9600; --gold: #ffc800;
  --bg: #f7f7f7; --card-bg: #fff; --text: #3c3c3c; --text-light: #777;
  --border: #e5e5e5; --shadow: 0 2px 0 rgba(0,0,0,.1); --shadow-lg: 0 4px 0 rgba(0,0,0,.15);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;user-select:none;-webkit-user-select:none}
.top-bar{position:sticky;top:0;z-index:100;background:var(--card-bg);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow)}
.top-bar .title{font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px}
.top-bar .stats{display:flex;gap:16px;align-items:center}
.stat-pill{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px;padding:6px 14px;border-radius:20px;background:#f0f0f0}
.stat-pill.hearts{color:var(--red)} .stat-pill.xp{color:var(--gold)} .stat-pill.streak{color:var(--orange)}
.stat-pill .icon{font-size:18px}
.map-container{max-width:720px;margin:0 auto;padding:32px 20px 100px}
.map-path{display:flex;flex-direction:column;align-items:center}
.level-node{position:relative;margin-bottom:28px;z-index:1}
.level-btn{width:72px;height:72px;border-radius:50%;border:none;cursor:pointer;font-size:28px;font-weight:800;color:#fff;display:flex;align-items:center;justify-content:center;position:relative;transition:transform .15s;box-shadow:var(--shadow-lg)}
.level-btn:hover:not(:disabled){transform:translateY(-2px)}
.level-btn:active:not(:disabled){transform:translateY(2px);box-shadow:var(--shadow)}
.level-btn.completed{background:var(--primary);border-bottom:4px solid var(--primary-dark)}
.level-btn.current{background:var(--gold);border-bottom:4px solid #e0b000;animation:pulse 1.5s ease-in-out infinite}
.level-btn.locked{background:#c8c8c8;border-bottom:4px solid #aaa;cursor:not-allowed;opacity:.6}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.level-btn .star-badge{position:absolute;top:-8px;right:-8px;background:var(--blue);color:#fff;border-radius:12px;padding:2px 8px;font-size:11px;font-weight:800;border:2px solid #fff}
.level-btn .lock-icon{font-size:24px;opacity:.7}
.connector{width:4px;height:24px;background:#ddd;margin:-14px 0 -14px 0;border-radius:2px}
.connector.done{background:var(--primary)}
.level-label{position:absolute;left:90px;top:50%;transform:translateY(-50%);white-space:nowrap}
.level-label .name{font-size:15px;font-weight:800}
.level-label .desc{font-size:12px;color:var(--text-light);margin-top:2px}
.level-label .tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;margin-top:4px}
.tag-easy{background:var(--primary-light);color:var(--primary-dark)}
.tag-medium{background:#fff3d6;color:#c4860a}
.tag-hard{background:#ffe0e0;color:var(--red-dark)}
.tag-boss{background:#f0e0ff;color:var(--purple-dark)}
.level-node:nth-child(even) .level-label{left:auto;right:90px;text-align:right}
.quiz-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.3);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.quiz-overlay.active{display:flex}
.quiz-card{background:var(--card-bg);border-radius:24px;max-width:640px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 8px 30px rgba(0,0,0,.2);animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.quiz-header{padding:16px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.quiz-header .progress-bar{flex:1;height:10px;background:#eee;border-radius:5px;margin-right:16px;overflow:hidden}
.quiz-header .progress-fill{height:100%;background:var(--primary);border-radius:5px;transition:width .3s}
.quiz-header .close-btn{background:none;border:none;font-size:22px;cursor:pointer;color:var(--text-light);padding:4px 8px}
.quiz-body{padding:24px}
.question-type{font-size:12px;font-weight:800;color:var(--blue);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.question-text{font-size:20px;font-weight:700;line-height:1.5;margin-bottom:24px}
.options{display:flex;flex-direction:column;gap:12px}
.option-btn{display:flex;align-items:center;gap:12px;padding:16px 20px;border:2px solid var(--border);border-radius:16px;background:#fff;cursor:pointer;font-size:15px;font-weight:600;color:var(--text);transition:all .15s;text-align:left;line-height:1.4}
.option-btn:hover{border-color:var(--blue);background:#f0faff}
.option-btn .opt-key{width:32px;height:32px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:var(--text-light);flex-shrink:0}
.option-btn.selected{border-color:var(--blue);background:#f0faff}
.option-btn.selected .opt-key{border-color:var(--blue);background:var(--blue);color:#fff}
.option-btn.correct{border-color:var(--primary);background:var(--primary-light)}
.option-btn.correct .opt-key{border-color:var(--primary);background:var(--primary);color:#fff}
.option-btn.wrong{border-color:var(--red);background:#ffe0e0}
.option-btn.wrong .opt-key{border-color:var(--red);background:var(--red);color:#fff}
.text-input{width:100%;padding:16px;border:2px solid var(--border);border-radius:16px;font-size:15px;font-family:inherit;min-height:100px;resize:vertical;transition:border-color .15s;line-height:1.5}
.text-input:focus{outline:none;border-color:var(--blue)}
.true-false{display:flex;gap:12px}
.true-false .option-btn{flex:1;justify-content:center}
.feedback{margin-top:20px;padding:16px 20px;border-radius:16px;display:none}
.feedback.show{display:block;animation:slideUp .2s ease}
.feedback.correct{background:var(--primary-light);border:2px solid var(--primary)}
.feedback.wrong{background:#ffe0e0;border:2px solid var(--red)}
.feedback .result-icon{font-size:20px;font-weight:800;margin-bottom:8px}
.feedback.correct .result-icon{color:var(--primary-dark)}
.feedback.wrong .result-icon{color:var(--red-dark)}
.feedback .explanation{font-size:14px;line-height:1.6}
.feedback .explanation strong{color:var(--text)}
.quiz-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.btn{padding:12px 32px;border:none;border-radius:14px;font-size:15px;font-weight:800;cursor:pointer;transition:transform .1s}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--primary);color:#fff;border-bottom:4px solid var(--primary-dark)}
.btn-primary:hover{background:var(--primary-dark)}
.btn-primary:disabled{background:#ccc;border-bottom-color:#aaa;cursor:not-allowed}
.victory-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:300;display:none;align-items:center;justify-content:center}
.victory-overlay.active{display:flex}
.victory-card{background:#fff;border-radius:24px;padding:40px;max-width:400px;width:90%;text-align:center;animation:bi .5s ease}
@keyframes bi{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
.victory-card .trophy{font-size:64px;margin-bottom:12px;animation:ts .8s ease}
@keyframes ts{0%,100%{transform:rotate(0)}25%{transform:rotate(-15deg)}75%{transform:rotate(15deg)}}
.victory-card h2{font-size:24px;font-weight:800;margin-bottom:8px}
.victory-card .subtitle{font-size:14px;color:var(--text-light);margin-bottom:24px}
.victory-card .rewards{display:flex;justify-content:center;gap:24px;margin-bottom:28px}
.reward-item{display:flex;flex-direction:column;align-items:center;gap:4px}
.reward-item .reward-icon{font-size:32px}
.reward-item .reward-val{font-size:18px;font-weight:800}
.reward-item .reward-label{font-size:11px;color:var(--text-light)}
.achievement-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--purple);color:#fff;padding:12px 24px;border-radius:16px;font-weight:700;font-size:14px;z-index:400;box-shadow:0 4px 16px rgba(0,0,0,.2);display:flex;align-items:center;gap:8px;transition:transform .3s ease}
.achievement-toast.show{transform:translateX(-50%) translateY(0)}
.start-screen{text-align:center;padding:60px 20px;max-width:600px;margin:0 auto}
.start-screen .hero-icon{font-size:72px;margin-bottom:16px;animation:bi .6s ease}
.start-screen h1{font-size:28px;font-weight:800;margin-bottom:8px}
.start-screen .subtitle{font-size:16px;color:var(--text-light);margin-bottom:32px}
.start-screen .player-card{background:#fff;border-radius:20px;padding:24px;box-shadow:var(--shadow);margin-bottom:24px;text-align:left}
.start-screen .player-card .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0f0f0}
.start-screen .player-card .row:last-child{border-bottom:none}
.start-screen .player-card .label{color:var(--text-light);font-size:14px}
.start-screen .player-card .value{font-weight:700;font-size:14px}
.tip-bubble{background:#fff;border:2px solid var(--border);border-radius:16px;padding:14px 18px;font-size:14px;color:var(--text-light);margin:16px 0}
.tip-bubble::before{content:'\1F4A1';margin-right:6px}
@media(max-width:480px){.level-label .desc{display:none}.level-btn{width:60px;height:60px;font-size:22px}.question-text{font-size:17px}.top-bar .title{font-size:15px}.stat-pill{font-size:12px;padding:4px 10px}}
</style>

<script>
// ===================== 题库数据 =====================
const LEVELS=[
{id:0,name:"JavaScript 基础村",desc:"JS 核心概念与原理",difficulty:"easy",icon:"🌱",questions:[
{type:"choice",q:"说说 JavaScript 中的事件循环（Event Loop）机制？",options:["A) 就是先执行同步代码再执行异步代码","B) 同步代码在调用栈执行，异步任务完成后回调放入任务队列，事件循环不断检查栈是否清空，清空后从队列取回调执行；微任务（Promise.then）优先于宏任务（setTimeout）","C) 事件循环就是 setInterval","D) 所有代码都是同步执行的没有事件循环"],answer:1,explain:"<strong>口答要点</strong>：JS 单线程，靠事件循环实现异步。调用栈执行同步代码；异步任务由 Web API 处理，完成后回调进入任务队列。栈清空后事件循环从队列取回调执行。<strong>微任务</strong>（Promise.then、queueMicrotask）在每次宏任务前清空；<strong>宏任务</strong>（setTimeout、I/O）按队列顺序执行。"},
{type:"choice",q:"说说闭包是什么？有什么实际应用？",options:["A) 闭包就是函数套函数没有特殊用途","B) 函数可以访问其外层作用域的变量即使外层函数已执行完毕；用于数据私有化、模块化、防抖节流、柯里化","C) 闭包会导致内存泄漏不应该使用","D) 闭包是 ES6 新增的"],answer:1,explain:"<strong>口答要点</strong>：闭包是函数与其词法环境的组合。内层函数引用外层函数变量，外层执行完后这些变量不回收。<strong>应用</strong>：1)数据私有化 2)模块模式(IIFE) 3)防抖/节流 4)柯里化 5)事件监听器保留状态。注意不当使用会内存泄漏。"},
{type:"choice",q:"var、let、const 三者的区别？",options:["A) 没有区别只是不同写法","B) var 有变量提升可重复声明函数作用域；let 无提升(暂时性死区)不可重复声明块级作用域；const 声明常量必须初始化不可重新赋值但对象内部属性可改","C) let 和 const 是 ES5 的","D) const 声明的对象属性也不能修改"],answer:1,explain:"<strong>口答要点</strong>：<strong>var</strong>：变量提升、函数作用域、可重复声明。<strong>let</strong>：块级作用域、暂时性死区、不可重复声明。<strong>const</strong>：必须初始化、不可重新赋值，但对象/数组内部属性可修改（引用地址没变）。推荐默认用 const，需要改值用 let，不用 var。"},
{type:"choice",q:"说说原型链是什么？如何实现继承？",options:["A) 原型链就是 prototype 属性的链条","B) 属性查找沿对象的内部原型关系向上进行，直到 null；可用 Object.getPrototypeOf 观察原型，class extends 可建立继承关系","C) 原型链是 ES6 才有的","D) 原型链和继承没有关系"],answer:1,explain:"属性先在对象自身查找，再沿内部原型关系向上。__proto__ 是历史访问器，并非每个对象都具有该属性。Object.create(null) 的原型为 null。class 与 extends 提供明确的构造和继承语义，实例属性与原型方法的归属应分别说明。"},
{type:"choice",q:"this 的指向规则？箭头函数的 this 有什么不同？",options:["A) this 永远指向 window","B) 普通函数 this 在调用时确定：默认指向 window(严格模式 undefined)、对象方法指向对象、构造函数指向实例；箭头函数没有自己的 this 继承定义时的外层 this 不可被 bind 改变","C) 箭头函数的 this 指向 window","D) this 在函数定义时就确定了"],answer:1,explain:"<strong>口答要点</strong>：普通函数 this 在<strong>调用时</strong>确定——谁调用指向谁。箭头函数<strong>没有自己的 this</strong>，继承外层作用域，定义时确定，call/apply/bind 无法改变。React 类组件用 bind 或箭头函数解决 this 问题；Vue 中不要用箭头函数定义 methods。"},
{type:"choice",q:"Promise 的状态有哪些？Promise.all 和 Promise.race 的区别？",options:["A) Promise 有 pending fulfilled rejected 三种状态状态不可逆","B) pending→fulfilled 或 pending→rejected 不可逆；Promise.all 所有成功才成功一个失败就失败；Promise.race 第一个完成的决定结果","C) Promise 状态可以反复改变","D) Promise.all 只要有一个成功就成功"],answer:1,explain:"<strong>口答要点</strong>：三种状态 pending/fulfilled/rejected 不可逆。Promise.all 全部 fulfilled 才 fulfilled，任一 rejected 立即 rejected。Promise.race 第一个完成的决定结果。还有 Promise.allSettled（等全部完成不管成败）和 Promise.any（任一 fulfilled 就 fulfilled）。"},
{type:"choice",q:"async/await 的原理？和 Promise 是什么关系？",options:["A) async/await 是 Promise 的替代品完全独立","B) async 函数返回 Promise；await 暂停当前异步函数的后续执行，处理普通值、Promise 或 thenable，拒绝可用 try/catch 捕获","C) await 只能等待 Promise","D) async 函数不返回 Promise"],answer:1,explain:"async 函数从调用开始同步执行到暂停点，返回值通过 Promise 表达。await 后的继续执行由异步调度安排，等待不阻塞整个线程。Generator 与执行器可用于演示或转译相似控制流，不能据此断言引擎原生实现方式。"},
{type:"choice",q:"说说 JavaScript 的垃圾回收机制？",options:["A) JS 没有垃圾回收需手动释放内存","B) 标记清除(主流)：从根出发标记可达对象清除不可达对象；V8 新生代用 Scavenge(复制)老生代用标记清除+标记整理","C) 垃圾回收只在页面关闭时执行","D) 闭包变量永远不会被回收"],answer:1,explain:"<strong>口答要点</strong>：V8 用<strong>分代回收</strong>——新生代用 Scavenge（from/to 空间复制）；老生代用标记清除+标记整理。核心：从 GC Roots 出发遍历，可达对象保留，不可达回收。常见内存泄漏：意外全局变量、遗忘的定时器、闭包引用、DOM 引用未清理。"},
{type:"choice",q:"深拷贝和浅拷贝的区别？怎么实现深拷贝？",options:["A) 没区别都是复制","B) 浅拷贝只复制第一层嵌套对象共享引用(Object.assign/展开运算符)；深拷贝递归复制所有层级(JSON.parse(JSON.stringify())有局限 structuredClone()推荐 或递归处理循环引用)","C) JSON.parse(JSON.stringify()) 能正确处理函数和 Date","D) 展开运算符是深拷贝"],answer:1,explain:"<strong>口答要点</strong>：浅拷贝：Object.assign、{...obj} 只复制一层。深拷贝：JSON 方法简单但不能处理函数/undefined/Symbol/循环引用/Date/RegExp；structuredClone() 原生支持循环引用和大部分类型；手写递归用 WeakMap 记录已拷贝对象处理循环引用。"},
{type:"choice",q:"call、apply、bind 三者的区别？",options:["A) 三者完全一样","B) call 和 apply 立即执行 call 逐个传参 apply 传数组；bind 返回绑定了 this 的新函数不立即执行","C) bind 会立即执行函数","D) apply 的参数是逗号分隔的"],answer:1,explain:"<strong>口答要点</strong>：<strong>call</strong>：fn.call(obj,arg1,arg2) 立即执行逐个传参。<strong>apply</strong>：fn.apply(obj,[args]) 立即执行传数组。<strong>bind</strong>：fn.bind(obj) 返回新函数 this 永久绑定可稍后执行。实际：call/apply 借用方法如 Array.prototype.slice.call(arguments)；bind 用于事件回调绑定 this。"},
{type:"truefalse",q:"typeof null 返回 'null'。",answer:false,explain:"<strong>口答要点</strong>：不对，typeof null 返回 'object'。这是 JS 历史 bug——早期类型标签低位 000 代表对象，null 全零位被误判。准确判断类型用 Object.prototype.toString.call(value)。判断 null 用 value === null。"},
{type:"truefalse",q:"== 比较时会进行类型转换，=== 不会。",answer:true,explain:"<strong>口答要点</strong>：正确。== 宽松相等会类型转换（1=='1' 为 true，null==undefined 为 true）。=== 严格相等不转换类型，类型和值都必须相同。推荐始终用 ===。"},
{type:"truefalse",q:"JavaScript 中所有对象都是通过 new 创建的。",answer:false,explain:"<strong>口答要点</strong>：不对。对象字面量 {} 也创建对象不需要 new。函数声明 function foo(){} 也不需要 new。Object.create(null) 创建的对象没有原型。"},
{type:"choice",q:"说说 JavaScript 的执行上下文和作用域链？",options:["A) 执行上下文就是函数的 this","B) 执行上下文包含变量环境( var 声明)和词法环境(let/const 声明)；作用域链由内到外查找变量直到全局；函数定义时确定词法作用域(静态作用域)不是调用时","C) 作用域链在函数调用时才创建","D) var 和 let 在同一个环境记录中"],answer:1,explain:"<strong>口答要点</strong>：执行上下文分<strong>全局/函数/eval</strong>三种。每个上下文有<strong>词法环境</strong>(let/const)和<strong>变量环境</strong>(var)。作用域链由内到外依次查找变量。JS 是<strong>词法作用域(静态作用域)</strong>——函数定义时确定作用域不是调用时。with 和 eval 能动态修改作用域(严格模式禁用)。"},
{type:"choice",q:"说说 ES6 的 Map/Set 和普通对象/数组的区别？WeakMap/WeakSet 有什么特殊？",options:["A) Map 就是对象的语法糖","B) Map 键可以是任意类型(对象只能字符串键)有 size/forEach 保持插入顺序；Set 自动去重；WeakMap 键只能是对象且弱引用不影响 GC 不可遍历适合存储私有数据","C) WeakMap 可以被 forEach 遍历","D) Map 不能存储对象键"],answer:1,explain:"<strong>口答要点</strong>：<strong>Map</strong>：键任意类型、保持插入顺序、size 属性、可遍历。比 Object 更适合频繁增删的场景。<strong>Set</strong>：自动去重。<strong>WeakMap</strong>：键必须是对象，弱引用(键对象被回收时自动清除对应条目)，不可遍历/没有 size。用途：存储 DOM 节点的私有数据、缓存计算结果不影响 GC。"},
{type:"choice",q:"Proxy 和 Reflect 是什么？Vue3 用 Proxy 实现响应式比 Object.defineProperty 好在哪？",options:["A) Proxy 只能代理对象的一个属性","B) Proxy 代理整个对象可拦截 13 种操作(get/set/has/deleteProperty 等)；Reflect 提供对应操作的默认行为；Vue3 用 Proxy 一次代理整个对象能检测属性新增/删除支持数组索引性能更好","C) Reflect 就是 Proxy 的别名","D) Object.defineProperty 比 Proxy 性能好"],answer:1,explain:"<strong>口答要点</strong>：<strong>Proxy</strong>：代理整个对象，拦截 get/set/has/deleteProperty/ownKeys 等 13 种 trap。<strong>Reflect</strong>：提供与 Proxy trap 对应的默认操作方法让代码更规范。<strong>Vue3 优势</strong>：1)代理整个对象不用逐个 defineProperty 2)检测属性新增/删除 3)支持数组索引和 length 4)惰性响应式(嵌套属性访问时才代理)性能更好。"},
{type:"choice",q:"Generator 函数和 async/await 的关系？Generator 怎么实现自动执行？",options:["A) Generator 和 async/await 没有任何关系","B) Generator 用 yield 暂停并由 next/throw 恢复；执行器可以驱动它等待 Promise，从而模拟某些 async/await 控制流程","C) Generator 可以自动执行不需要 next()","D) async/await 是 Generator 的替代品没有关系"],answer:1,explain:"Generator 返回可显式推进的迭代器。执行器可以等待 yield 出的值，并将兑现结果传给 next、拒绝传给 throw。async 函数直接返回 Promise，await 按其自身语义继续执行；描述转译方案时应说明实现假设。"},
{type:"choice",q:"说说 JavaScript 的模块化历程？CommonJS/AMD/UMD/ESM 的区别？",options:["A) 只有 ES Module 一种模块化方案","B) CommonJS(Node 同步 require) AMD(浏览器异步 RequireJS) UMD(兼容两者) ESM(静态分析 import/export 标准)；ESM 支持 tree-shaking 编译时确定依赖","C) AMD 是 Node 的模块化方案","D) CommonJS 支持静态分析和 tree-shaking"],answer:1,explain:"<strong>口答要点</strong>：<strong>CommonJS</strong>：Node 采用，同步加载，require/module.exports，值拷贝。<strong>AMD</strong>：浏览器异步加载(RequireJS)，已基本淘汰。<strong>UMD</strong>：兼容 CommonJS 和 AMD 的通用模式。<strong>ESM</strong>：ES6 标准，import/export，编译时静态分析，值引用，支持 tree-shaking。现代前端优先用 ESM。"},
{type:"truefalse",q:"Symbol 是 JavaScript 的原始类型之一，每个 Symbol 值都是唯一的。",answer:true,explain:"<strong>口答要点</strong>：正确。Symbol 是 ES6 新增的原始类型，每个 Symbol() 调用返回唯一值。主要用途：1)对象私有属性(不会被 Object.keys 遍历) 2)定义内置行为如 Symbol.iterator(使对象可 for...of) Symbol.toPrimitive Symbol.hasInstance。Symbol.for() 会注册全局共享的 Symbol。"},
{type:"truefalse",q:"箭头函数没有 arguments、super、new.target 绑定。",answer:true,explain:"<strong>口答要点</strong>：正确。箭头函数没有自己的 arguments(继承外层)、没有 prototype 不能 new、this/super/new.target 都继承外层作用域。需要 arguments 时用剩余参数 ...args 替代。"},
]},

{id:10,name:"设计模式殿堂",desc:"前端常用设计模式与实战",difficulty:"medium",icon:"🏗️",questions:[
{type:"choice",q:"单例模式是什么？在前端中有什么应用？怎么实现？",options:["A) 单例就是只能创建一个变量的模式","B) 保证一个类只有一个实例并提供全局访问点；前端应用：Vuex/Pinia store、全局弹窗、日志管理、数据库连接池；实现：闭包保存实例或 class + static 属性","C) 单例模式可以用 Object.create 替代","D) 单例模式会导致内存泄漏"],answer:1,explain:"<strong>口答要点</strong>：单例模式确保全局只有一个实例。<strong>实现方式</strong>：1)闭包：<code>const Singleton=(()=>{let instance;return{getInstance(){if(!instance)instance=new MyClass();return instance}}})()</code> 2)class static 属性。<strong>前端应用</strong>：Vuex store(单一数据源)、全局 Toast/Modal、WebSocket 连接管理。<strong>注意</strong>：不要滥用单例造成全局耦合。"},
{type:"choice",q:"观察者模式和发布订阅模式的区别？",options:["A) 两者完全一样","B) 观察者：目标直接维护观察者列表通知时遍历调用(耦合紧)；发布订阅：通过事件中心解耦发布者和订阅者互不感知(松耦合)；Vue 自定义事件是观察者 EventEmitter 是发布订阅","C) 发布订阅模式耦合更紧","D) 观察者模式需要中间人"],answer:1,explain:"<strong>口答要点</strong>：<strong>观察者</strong>：Subject 维护 Observer 列表，notify 时直接调用 observer.update()，双方有直接依赖。<strong>发布订阅</strong>：Publisher 和 Subscriber 通过<strong>事件中心(Event Bus)</strong>通信，互不知道对方。<strong>前端应用</strong>：Vue 的响应式是观察者模式(依赖收集+派发更新)；EventBus/mitt 是发布订阅。发布订阅更解耦但调试更难。"},
{type:"choice",q:"策略模式是什么？在前端中怎么应用？",options:["A) 策略模式就是 if-else 的别名","B) 将不同算法封装成独立策略类通过接口切换；消除大量 if-else/switch；前端应用：表单验证规则、不同支付方式处理、奖金计算、动画缓动函数","C) 策略模式只能用于后端","D) 策略模式增加代码复杂度没有好处"],answer:1,explain:"<strong>口答要点</strong>：策略模式把一系列算法封装成策略对象，通过切换策略改变行为。<strong>核心价值</strong>：消除 if-else/switch。<strong>前端应用</strong>：1)表单验证——不同规则用不同策略函数 <code>{required:fn, email:fn, phone:fn}</code> 2)不同支付方式处理逻辑 3)动画缓动算法(easeIn/easeOut/linear)。<strong>优势</strong>：开闭原则(新增策略不改原代码)。"},
{type:"choice",q:"代理模式在前端中的应用？和装饰器模式有什么区别？",options:["A) 代理模式和装饰器模式完全相同","B) 代理模式控制对原对象的访问(拦截/验证/缓存/延迟加载)；装饰器模式动态扩展功能不改原对象；代理重在控制访问装饰器重在增强功能；前端：Proxy 虚拟代理(图片懒加载) 缓存代理","C) 装饰器模式用于控制访问权限","D) 代理模式不能缓存结果"],answer:1,explain:"<strong>口答要点</strong>：<strong>代理模式</strong>：控制对原对象的访问——拦截、验证、缓存、延迟加载。<strong>装饰器模式</strong>：在不改变原对象基础上动态扩展功能。<strong>区别</strong>：代理重在「控制访问」装饰器重在「增强功能」。<strong>前端应用</strong>：1)Vue3 Proxy 响应式就是代理模式 2)图片懒加载(虚拟代理) 3)防抖/节流(代理函数控制执行频率) 4)缓存代理(记忆化函数)。"},
{type:"choice",q:"工厂模式是什么？在前端中有什么实际应用？",options:["A) 工厂模式就是 new 一个对象","B) 封装对象的创建过程调用者不关心具体类；简单工厂(一个工厂方法) 工厂方法(子类决定创建) 抽象工厂(创建产品族)；前端：React.createElement Vue 的 h() 创建虚拟 DOM","C) 工厂模式只能创建一种对象","D) 工厂模式和单例模式一样"],answer:1,explain:"<strong>口答要点</strong>：工厂模式封装对象创建过程。<strong>前端应用</strong>：1)React.createElement(type,props,...children) 工厂函数创建虚拟 DOM 2)Vue 的 h() 函数 3)根据类型创建不同组件实例 4)创建不同类型的弹窗(Toast/Confirm/Modal)。<strong>价值</strong>：调用者不关心创建细节，符合开闭原则。"},
{type:"choice",q:"装饰器模式是什么？ES7 装饰器在前端中的应用场景？",options:["A) 装饰器就是给函数加注释","B) 动态给对象添加功能不改变原对象；ES7 装饰器(@decorator)用于类/方法/属性；应用：日志记录、权限校验、性能监控、AOP 编程；React 的 HOC(Higher-Order Component)本质是装饰器","C) 装饰器模式会修改原对象","D) ES7 装饰器只能用于类不能用于方法"],answer:1,explain:"<strong>口答要点</strong>：装饰器模式动态扩展对象功能不改原对象。<strong>ES7 @decorator</strong>：作用于类/方法/属性。<strong>前端应用</strong>：1)React HOC(Higher-Order Component)——withRouter(withAuth(Component)) 2)类方法日志/权限/性能装饰 3)NestJS 大量使用装饰器(@Controller/@Get/@Injectable)。<strong>本质</strong>：函数接受类/方法返回增强版。"},
{type:"truefalse",q:"Vue3 的 reactive 本质上是代理模式（Proxy）的应用。",answer:true,explain:"<strong>口答要点</strong>：正确。Vue3 reactive() 用 Proxy 代理目标对象，在 get 中 track(收集依赖)在 set 中 trigger(派发更新)。这是代理模式的经典应用——不修改原对象，通过代理拦截操作。"},
{type:"truefalse",q:"发布订阅模式中，发布者和订阅者之间有直接依赖关系。",answer:false,explain:"<strong>口答要点</strong>：不对。发布订阅模式通过<strong>事件中心(Event Bus)</strong>解耦，发布者和订阅者互不感知。这正是它和观察者模式的核心区别——观察者模式中 Subject 直接持有 Observer 引用有直接依赖。"},
{type:"choice",q:"迭代器模式是什么？ES6 中如何实现？",options:["A) 迭代器就是 for 循环","B) 提供统一的方式遍历集合元素；ES6 用 Symbol.iterator 实现迭代器协议；实现 next() 方法返回 {value,done}；for...of/展开运算符/解构赋值都依赖迭代器协议","C) 迭代器只能遍历数组","D) 迭代器模式和生成器模式无关"],answer:1,explain:"<strong>口答要点</strong>：迭代器模式提供统一遍历接口。<strong>ES6 实现</strong>：对象实现 <code>[Symbol.iterator](){return{next(){return{value,done}}}}</code>。<strong>内置可迭代对象</strong>：Array/String/Map/Set/arguments/NodeList。<strong>消费迭代器</strong>：for...of、展开运算符...、解构赋值、Array.from。Generator 函数自动返回迭代器。"},
]},

{id:11,name:"手写代码竞技场",desc:"高频手写实现题",difficulty:"hard",icon:"✍️",questions:[
{type:"choice",q:"手写防抖(debounce)函数？说说原理和应用场景。",options:["A) 防抖就是让函数延迟执行一次","B) 原理：每次调用清除上一个定时器重新计时，只有停止触发后才执行最后一次；闭包保存 timerId；应用：搜索框输入、窗口 resize、按钮防重复点击","C) 防抖和节流是同一个东西","D) 防抖函数没有参数"],answer:1,explain:"<strong>口答要点</strong>：<strong>防抖</strong>——N 秒内再次触发则重新计时，只执行最后一次。<code>function debounce(fn,delay){let timer;return(...args)=>{clearTimeout(timer);timer=setTimeout(()=>fn.apply(this,args),delay)}}</code>。<strong>应用</strong>：搜索联想(用户停止输入再请求)、resize 监听(调整完再处理)、按钮防重复提交。<strong>注意</strong>：用 apply 保留 this 和参数。"},
{type:"choice",q:"手写节流(throttle)函数？和防抖的区别？",options:["A) 节流就是让函数只执行一次","B) 原理：固定时间间隔内只执行一次(时间戳或定时器实现)；防抖是最后才执行节流是间隔执行；应用：滚动加载、鼠标移动、播放进度更新","C) 节流和防抖完全一样","D) 节流函数不能传参数"],answer:1,explain:"<strong>口答要点</strong>：<strong>节流</strong>——N 秒内只执行一次，稀释执行频率。<code>function throttle(fn,delay){let last=0;return(...args)=>{const now=Date.now();if(now-last>=delay){fn.apply(this,args);last=now}}}</code>。<strong>和防抖区别</strong>：防抖只执行最后一次，节流按固定间隔执行。<strong>应用</strong>：滚动监听(无限加载)、鼠标拖拽、播放器进度条。"},
{type:"choice",q:"手写深拷贝？处理循环引用和特殊类型？",options:["A) JSON.parse(JSON.stringify()) 就够了","B) 递归遍历用 WeakMap 记录已拷贝对象处理循环引用；处理 Date/RegExp/Symbol/Map/Set 等特殊类型；structuredClone() 是原生方案但不能拷贝函数","C) 深拷贝不需要处理循环引用","D) Object.assign 是深拷贝"],answer:1,explain:"<strong>口答要点</strong>：<strong>核心要点</strong>：1)递归处理对象/数组 2)<strong>WeakMap 记录已访问对象</strong>解决循环引用 3)特殊类型：Date(new Date(d.getTime()))、RegExp(new RegExp(r.source,r.flags))、Map/Set 递归拷贝 4)Symbol 用 Object.getOwnPropertySymbols 获取。<strong>原生方案</strong>：structuredClone() 支持循环引用和大部分类型但不支持函数。<strong>JSON 方案</strong>局限：不能处理函数/undefined/Symbol/循环引用/Date(变字符串)。"},
{type:"choice",q:"手写 Promise.all？说说原理和边界处理。",options:["A) Promise.all 就是循环调用 then","B) 遍历输入，用 Promise.resolve 处理每项，按输入下标保存结果；全部兑现才成功，任一拒绝则失败，空可迭代对象得到空结果","C) Promise.all 是串行执行","D) Promise.all 顺序执行每个 Promise"],answer:1,explain:"教学版可先把有限可迭代输入转为数组，再按下标处理各项。数组迭代会把空槽作为 undefined，forEach 会跳过空槽。应测试空输入、稀疏数组、普通值、逆序完成和拒绝。已有 Promise 的工作通常在组合前就启动，Promise.all 负责组合其结果。"},
{type:"choice",q:"手写一个简易的发布订阅(EventEmitter)？",options:["A) 就是一个数组存函数","B) 用 Map 存储事件名到回调数组映射；on 订阅(push 到数组) emit 遍历调用 off 过滤删除 once 注册后自动移除","C) 发布订阅不需要 off 方法","D) emit 只能通知一个订阅者"],answer:1,explain:"<strong>口答要点</strong>：<code>class EventEmitter{constructor(){this.events=new Map()}on(event,cb){this.events.get(event)?.push(cb)||this.events.set(event,[cb])}emit(event,...args){this.events.get(event)?.forEach(cb=>cb(...args))}off(event,cb){this.events.set(event,this.events.get(event)?.filter(f=>f!==cb)||[])}once(event,cb){const wrap=(...args)=>{cb(...args);this.off(event,wrap)};this.on(event,wrap)}}</code>。"},
{type:"choice",q:"手写实现 call/apply/bind？",options:["A) 这三个不能手动实现","B) call/apply 调用时指定接收者与参数；bind 返回可延后调用的绑定函数，完整语义还涉及部分参数和构造调用","C) bind 和 call 实现方式完全一样","D) apply 不能传数组参数"],answer:1,explain:"在对象上临时挂方法的演示有范围限制，需要处理属性冲突、异常清理、原始值、冻结对象及严格模式的 this。简单闭包绑定可用于普通调用；对可构造目标，new 绑定函数时还涉及新实例、原型关系与返回值，不能把普通调用版当成完整原生实现。"},
{type:"choice",q:"手写 Promise（A+ 规范核心）？关键状态管理？",options:["A) Promise 就是一个回调队列","B) 三状态 pending→fulfilled/rejected 不可逆；then 返回新 Promise 链式调用；executor 中 resolve/reject 改变状态；异步用微任务(setTimeout 模拟)回调队列存 pending 时的 then 回调","C) Promise 状态可以反复改变","D) then 不返回 Promise"],answer:1,explain:"<strong>口答要点</strong>：<strong>核心结构</strong>：1)state/value/reason 2)onFulfilledCallbacks/onRejectedCallbacks 队列 3)resolve/reject 改状态并执行队列 4)then 返回新 Promise(resolvePromise 处理返回值)。<strong>关键点</strong>：状态不可逆、then 回调异步执行(微任务)、返回值是 Promise 则递归 resolve、值不能等于返回的 Promise(防循环)。面试一般不要求完整 A+ 但核心结构要会。"},
{type:"truefalse",q:"手写防抖函数时需要用闭包保存 timer 变量。",answer:true,explain:"<strong>口答要点</strong>：正确。timer 需要在多次调用间共享但又不能是全局变量(防止污染)。闭包是唯一方案——返回的函数引用外层的 timer 变量，每次调用清除上一个定时器。这就是闭包的经典应用。"},
{type:"truefalse",q:"手写深拷贝时用 Map 来记录已拷贝的对象处理循环引用比 WeakMap 更好。",answer:false,explain:"Map 与 WeakMap 都能用作已访问对象到副本的映射，解决环与共享引用。单次调用内部的映射若能随调用一起释放，Map 本身不会必然导致泄漏。选择依据包括映射寿命、是否需要枚举，以及是否希望弱持有键；应先明确克隆支持的类型。"},
]},
// ===================== 新增关卡：ES6+与TypeScript =====================
{id:12,name:"ES6+ 与 TS 进阶",desc:"现代JS特性与TypeScript深度",difficulty:"hard",icon:"📘",questions:[
{type:"choice",q:"ES6 的 Class 和构造函数有什么区别？extends 的本质？",options:["A) Class 完全是新的东西和构造函数无关","B) Class 是构造函数的语法糖有 prototype 和 __proto__；extends 本质是原型链继承+super 调用父类构造函数；static 静态方法在类本身上；#private 私有字段","C) Class 不支持继承","D) Class 的方法不在 prototype 上"],answer:1,explain:"<strong>口答要点</strong>：Class 是构造函数语法糖。class 方法在 prototype 上(static 在类本身)。extends 本质：子类 __proto__ 指向父类(继承静态方法)、子类 prototype.__proto__ 指向父类 prototype(继承实例方法)。super() 必须在 constructor 中 this 之前调用(因为子类 this 要先由父类构造函数创建)。ES2022 新增 #private 私有字段。"},
{type:"choice",q:"说说 TypeScript 的泛型？泛型约束是什么？",options:["A) 泛型就是 any 的别名","B) 泛型是类型的参数化<T>让类型可复用；泛型约束用 extends 限制类型范围(如<T extends {length:number}>)；keyof T 获取类型键的联合类型；T[K] 索引访问类型","C) 泛型只能用于函数","D) 泛型不能有约束"],answer:1,explain:"<strong>口答要点</strong>：泛型让类型像参数一样传入。<code>function identity&lt;T&gt;(arg:T):T{return arg}</code>。<strong>泛型约束</strong>：<code>&lt;T extends {length:number}&gt;</code> 限制 T 必须有 length 属性。<strong>常用组合</strong>：keyof T(键的联合类型)、T[K](索引访问)、typeof(取值类型)、extends(条件类型)。泛型默认值：<code>&lt;T=string&gt;</code>。"},
{type:"choice",q:"TypeScript 的工具类型(Partial/Required/Pick/Omit/Record/Exclude/Extract)怎么用？",options:["A) 工具类型就是给类型起别名","B) Partial<T> 全可选 Required<T> 全必选 Pick<T,K> 选取属性 Omit<T,K> 排除属性 Record<K,V> 键值对映射 Exclude<T,U> 排除联合类型成员 Extract<T,U> 保留成员","C) Partial 和 Required 功能相同","D) Record 只能用于数字键"],answer:1,explain:"<strong>口答要点</strong>：<strong>Partial&lt;T&gt;</strong>：所有属性变可选(映射类型 + keyof)。<strong>Required&lt;T&gt;</strong>：所有属性变必选(-? 修饰符)。<strong>Pick&lt;T,K&gt;</strong>：从 T 中选取 K 指定的属性。<strong>Omit&lt;T,K&gt;</strong>：排除 K 指定的属性(Pick+Exclude 实现)。<strong>Record&lt;K,V&gt;</strong>：{[key:K]:V}。<strong>Exclude&lt;T,U&gt;</strong>：从联合类型 T 中排除 U。<strong>Extract&lt;T,U&gt;</strong>：保留 T 中属于 U 的。"},
{type:"choice",q:"TypeScript 的条件类型和 infer 关键字？",options:["A) 条件类型就是 if-else","B) T extends U ? X : Y 条件类型根据类型关系选择；infer R 在条件类型中推断类型变量；常用于提取函数返回类型/参数类型/数组元素类型等类型体操","C) infer 可以在普通类型中使用","D) 条件类型不支持嵌套"],answer:1,explain:"<strong>口答要点</strong>：<strong>条件类型</strong>：<code>T extends U ? X : Y</code>。<strong>infer</strong>：在 extends 右侧声明待推断的类型变量。<strong>经典应用</strong>：<code>type ReturnType&lt;T&gt;=T extends(...args:any[])=>infer R ? R : never</code> 提取函数返回类型。<code>type Parameters&lt;T&gt;=T extends(...args:infer P)=>any ? P : never</code> 提取参数类型。类型体操核心工具。"},
{type:"choice",q:"TypeScript 中 interface 和 type 的区别？什么时候用哪个？",options:["A) 两者完全一样没有区别","B) interface 可声明合并(同名自动合并)适合对象形状描述；type 不可合并但能表达联合/交叉/条件/映射类型等更灵活；对象用 interface 其他用 type","C) type 支持声明合并","D) interface 可以定义联合类型"],answer:1,explain:"<strong>口答要点</strong>：<strong>interface</strong>：可声明合并(同名 interface 自动合并属性)、只能描述对象形状、可被 implements。<strong>type</strong>：不可声明合并、能表达联合/交叉/条件/映射/模板字面量类型等。<strong>建议</strong>：对象形状用 interface(可扩展合并)，联合/交叉/工具类型用 type。库的开发用 interface 方便用户扩展。"},
{type:"choice",q:"说说 TypeScript 的协变和逆变？函数参数类型兼容性？",options:["A) TypeScript 没有协变逆变","B) 协变：子类型可以赋值给父类型(返回值协变)；逆变：父类型可以赋值给子类型(参数严格逆变但 TS 默认双变)；strictFunctionTypes 开启后函数参数逆变检查更严格","C) 协变和逆变只出现在 Java 中","D) TypeScript 的函数参数是协变的"],answer:1,explain:"<strong>口答要点</strong>：<strong>协变</strong>：Dog[] 可以赋值给 Animal[](子类型数组赋给父类型数组)。<strong>逆变</strong>：函数参数类型——(animal:Animal)=>void 可以赋值给(dog:Dog)=>void 的位置(父类型函数参数赋给子类型)。<strong>TS 特性</strong>：默认函数参数双变(为了实用)，strictFunctionTypes 开启后严格逆变检查。返回值协变。"},
{type:"choice",q:"ES6 的解构赋值有哪些用法？默认值怎么用？",options:["A) 解构只能用于数组","B) 数组解构按位置对象解构按属性名；默认值用 = 赋予(只在严格 undefined 时生效)；支持嵌套解构和剩余语法 ...rest；函数参数解构常用","C) 解构不能有默认值","D) 对象解构按位置"],answer:1,explain:"<strong>口答要点</strong>：<strong>数组解构</strong>：[a,b]=arr 按位置。<strong>对象解构</strong>：{name,age}=obj 按属性名。<strong>默认值</strong>：{x=10} 只在值为 undefined 时生效(null 不触发)。<strong>重命名</strong>：{oldName:newName}。<strong>嵌套</strong>：{a:{b}}。<strong>剩余</strong>：{a,...rest}。函数参数解构：function foo({name='default'}={}){}。"},
{type:"choice",q:"说说 ES6 的模板字符串、标签模板和字符串扩展？",options:["A) 模板字符串就是字符串拼接","B) 反引号支持多行字符串和 ${} 插值；标签模板 fn\`str\` 把模板拆成字符串数组和插值传给函数；新增方法：includes/startsWith/endsWith/repeat/padStart/padEnd","C) 模板字符串不能多行","D) 标签模板没有实际用途"],answer:1,explain:"<strong>口答要点</strong>：模板字符串用反引号，${} 插值表达式。<strong>标签模板</strong>：<code>tag\`Hello ${name}!\`</code> 调用 tag(strings,...values)——strings 是字符串部分数组 values 是插值数组。应用：i18n 国际化、防 XSS 转义、SQL 模板。<strong>新增方法</strong>：includes/startsWith/endsWith/repeat(n)/padStart(len,fill)/padEnd。"},
{type:"truefalse",q:"TypeScript 编译后不会保留类型信息，类型只在编译时检查。",answer:true,explain:"<strong>口答要点</strong>：正确。TypeScript 是<strong>编译时类型系统</strong>——类型信息在编译成 JS 后完全擦除(erased)。运行时没有任何类型信息。所以 typeof/instanceof 只能检查运行时类型不能检查 TS 类型。如需运行时类型检查用类型守卫(user-defined type guard)或 Schema 验证(zod/io-ts)。"},
{type:"truefalse",q:"TypeScript 的 enum 在编译后会变成对象。",answer:true,explain:"<strong>口答要点</strong>：正确。数字枚举编译后生成正向和反向映射的对象：<code>enum Direction{Up,Down}</code> → <code>var Direction;(function(Direction){Direction[0]='Up';Direction['Up']=0})(Direction||={})</code>。字符串枚举只生成正向映射。const enum 编译时内联(替换成具体值)不生成对象。"},
]},
// ===================== 新增关卡：浏览器渲染与安全 =====================
{id:13,name:"浏览器渲染与安全",desc:"渲染原理+Web安全+存储",difficulty:"hard",icon:"🌍",questions:[
{type:"choice",q:"浏览器渲染的完整流程？DOM/CSSOM/渲染树的关系？",options:["A) 浏览器直接渲染 HTML 不需要构建树","B) HTML→DOM 树 CSS→CSSOM 树 合并→Render Tree(渲染树只含可见元素)→Layout(布局计算位置大小)→Paint(绘制像素)→Composite(合成层合并)；display:none 不在渲染树中 visibility:hidden 在","C) CSSOM 和 DOM 是同一棵树","D) 布局在渲染树之前"],answer:1,explain:"<strong>口答要点</strong>：1)<strong>解析 HTML→DOM</strong> 2)<strong>解析 CSS→CSSOM</strong> 3)<strong>合并→Render Tree</strong>(只含可见元素，display:none 不入树) 4)<strong>Layout</strong>：计算每个节点位置大小 5)<strong>Paint</strong>：绘制为像素 6)<strong>Composite</strong>：合成层合并显示。<strong>JS 阻塞</strong>：script 标签阻塞 HTML 解析(除非 async/defer)。"},
{type:"choice",q:"什么是回流(重排)和重绘？怎样减少？合成层是什么？",options:["A) 回流和重绘是同一件事","B) 回流：几何变化(宽高/位置/显示)重新布局代价大；重绘：外观变化(颜色/背景)不改变布局；合成层：transform/opacity 走 GPU 合成不触发回流重绘；减少回流：批量修改样式用 transform 代替 top/left 避免逐条读取布局属性","C) transform 会触发回流","D) 改变颜色会触发回流"],answer:1,explain:"<strong>口答要点</strong>：<strong>回流</strong>：元素几何属性变化触发重新布局代价大。<strong>重绘</strong>：外观变化不改变布局代价小。<strong>合成层</strong>：transform/opacity 创建独立合成层走 GPU 不触发回流重绘。<strong>优化</strong>：1)用 transform 代替 top/left 2)用 opacity 代替 visibility 3)避免逐条改样式用 class 4)避免频繁读 offsetTop 等强制同步布局 5)对动画元素用 will-change 提示创建合成层。"},
{type:"choice",q:"浏览器的垃圾回收机制？V8 的新生代和老生代回收策略？",options:["A) 浏览器不回收内存","B) V8 分代回收：新生代用 Scavenge(From/To 空间复制存活对象)存活两次晋升老生代；老生代用标记清除+标记整理(碎片多时整理)；增量标记和并发标记减少停顿","C) 新生代用标记清除","D) 老生代用 Scavenge"],answer:1,explain:"<strong>口答要点</strong>：V8 <strong>分代回收</strong>：<strong>新生代</strong>(1-8MB)：Scavenge 算法——From 空间存活对象复制到 To，清空 From，角色互换。存活两次的对象晋升老生代。<strong>老生代</strong>：标记清除(从 GC Root 标记可达对象清除不可达) + 标记整理(碎片多时移动对象整理空间)。<strong>优化</strong>：增量标记(把标记拆成小步减少停顿)、并发标记(辅助线程标记不阻塞主线程)。<strong>常见泄漏</strong>：遗忘的定时器/事件监听/闭包/DOM 引用/全局变量。"},
{type:"choice",q:"浏览器的存储方案有哪些？Cookie/LocalStorage/SessionStorage/IndexedDB 的区别？",options:["A) 所有存储都一样","B) Cookie：4KB 每次请求自动携带可设过期 HttpOnly；LocalStorage：5MB+ 持久化不自动携带；SessionStorage：5MB 标签页关闭清除；IndexedDB：大容量异步 NoSQL 数据库支持事务","C) LocalStorage 会自动发送给服务器","D) IndexedDB 同步操作"],answer:1,explain:"<strong>口答要点</strong>：<strong>Cookie</strong>：4KB 限制每次请求自动携带(浪费流量)可设 HttpOnly/Secure/SameSite。<strong>LocalStorage</strong>：5-10MB 持久化除非手动清除同源共享。<strong>SessionStorage</strong>：5-10MB 标签页隔离关闭清除。<strong>IndexedDB</strong>：大容量(几百 MB+)异步 NoSQL 支持事务/索引/游标适合离线应用。<strong>选择</strong>：登录态用 Cookie+HttpOnly；用户偏好 LocalStorage；临时数据 SessionStorage；离线大量数据 IndexedDB。"},
{type:"choice",q:"CSP(内容安全策略)是什么？怎么配置？防什么攻击？",options:["A) CSP 是加密传输协议","B) CSP 约束脚本等资源的加载和执行；响应头可部署强制策略或单独的报告策略","C) CSP 可以替代 HTTPS","D) CSP 只能防止 CSRF"],answer:1,explain:"CSP 指令分别约束不同资源。Content-Security-Policy 响应头用于强制执行；Content-Security-Policy-Report-Only 用于观察候选策略。报告目的地与是否阻断是不同设置。富文本仍要按展示上下文清理或安全输出。"},
{type:"choice",q:"什么是同源策略？为什么需要它？跨域方案有哪些？",options:["A) 同源策略是浏览器的 bug","B) 同源(协议+域名+端口相同)策略限制 JS 跨域读取响应/操作 DOM/Cookie 防止恶意网站攻击；跨域方案：CORS(服务端配 Access-Control-Allow-Origin) 代理(Nginx/Webpack) JSONP(仅 GET)","C) 同源策略不影响 Cookie","D) 跨域方案只有 JSONP"],answer:1,explain:"<strong>口答要点</strong>：同源策略限制不同源的文档间交互——不能读 DOM、不能读 AJAX 响应、不能操作 Cookie(同源 Cookie 可以)。<strong>为什么</strong>：防止恶意网站读取用户在其他网站的数据。<strong>CORS</strong>(推荐)：服务端设 Access-Control-Allow-Origin，复杂请求(非简单请求)先发 OPTIONS 预检。<strong>代理</strong>：开发用 devServer proxy，生产用 Nginx 反代(服务器间无跨域限制)。<strong>JSONP</strong>：script 标签不受同源限制但只支持 GET 已淘汰。"},
{type:"choice",q:"什么是 Service Worker？它能做什么？和 Web Worker 的区别？",options:["A) Service Worker 就是 Web Worker 改名","B) Service Worker 是浏览器后台运行的独立线程可拦截网络请求实现离线缓存/推送通知/后台同步；生命周期 install/activate/fetch；必须 HTTPS；Web Worker 是页面级子线程不能拦截请求","C) Service Worker 可以操作 DOM","D) Service Worker 在 HTTP 下也能用"],answer:1,explain:"<strong>口答要点</strong>：<strong>Service Worker</strong>：独立线程可拦截和处理网络请求(通过 fetch 事件)实现离线缓存(Cache API)、推送通知(Push API)、后台同步。<strong>生命周期</strong>：install(安装)→activate(激活)→fetch(拦截请求)。<strong>限制</strong>：不能操作 DOM、必须 HTTPS(除了 localhost)、有作用域限制。<strong>和 Web Worker 区别</strong>：SW 是页面级代理生命周期独立于页面；Web Worker 随页面销毁。PWA 核心技术。"},
{type:"choice",q:"XSS 攻击有哪些类型？如何全面防御？",options:["A) XSS 就是注入 SQL","B) 存储型(恶意代码存入数据库其他用户查看时执行) 反射型(URL 参数注入) DOM 型(JS 操作 DOM 注入)；防御：输出转义(HTML/JS/URL) CSP HttpOnly Cookie 输入校验 避免innerHTML 用 textContent","C) XSS 只有一种类型","D) HTTPS 可以防 XSS"],answer:1,explain:"<strong>口答要点</strong>：<strong>三种 XSS</strong>：1)<strong>存储型</strong>(最危险)：恶意脚本存数据库，如评论框注入 2)<strong>反射型</strong>：URL 参数被注入到页面 3)<strong>DOM 型</strong>：前端 JS 操作 DOM 时注入(如 innerHTML=userInput)。<strong>防御</strong>：1)输出转义(按上下文：HTML/JS/URL/CSS) 2)CSP 白名单 3)HttpOnly Cookie(防 Cookie 窃取) 4)用 textContent 代替 innerHTML 5)Vue/React 默认转义(除非用 dangerouslySetInnerHTML/v-html)。"},
{type:"truefalse",q:"浏览器的 script 标签默认会阻塞 HTML 解析。",answer:true,explain:"<strong>口答要点</strong>：正确。默认 script 标签下载和执行都会阻塞 HTML 解析。<strong>async</strong>：下载不阻塞但执行阻塞(下载完立即执行顺序不确定)适合独立脚本(如统计)。<strong>defer</strong>：下载不阻塞执行延迟到 HTML 解析完成后按顺序执行适合依赖 DOM 的脚本。<strong>module</strong>：默认 defer 行为。优化：关键脚本用 defer 放 head 提前下载。"},
{type:"truefalse",q:"浏览器的重排(回流)一定比重绘代价大。",answer:true,explain:"<strong>口答要点</strong>：正确。重排改变元素几何属性(位置/大小)需要重新计算布局——后续所有元素位置可能变化。重绘只改变外观(颜色/背景)不影响布局。重排必然触发重绘(先重新布局再重绘)但重绘不一定触发重排。优化优先级：避免重排 > 避免重绘 > 利用合成层(transform/opacity 走 GPU)。"},
]},
// ===================== 新增关卡：Redis与后端 =====================
{id:14,name:"Redis 与后端深谷",desc:"缓存策略与后端高频考点",difficulty:"hard",icon:"🗄️",questions:[
{type:"choice",q:"缓存穿透是什么？怎么解决？",options:["A) 缓存穿透就是缓存太多数据","B) 恶意请求查询不存在的数据(如 id=-1)每次都打到数据库；解决：1)布隆过滤器拦截不存在 key 2)缓存空值(null)设短 TTL 3)参数校验拦截非法请求","C) 缓存穿透是缓存过期了","D) 缓存穿透不影响数据库"],answer:1,explain:"<strong>口答要点</strong>：<strong>缓存穿透</strong>：查询<strong>不存在的数据</strong>，缓存和数据库都没有，每次请求都打到数据库。<strong>场景</strong>：恶意攻击(查询 id=-1)。<strong>解决方案</strong>：1)<strong>布隆过滤器</strong>(推荐)：预先加载所有 key，请求前判断 key 是否可能存在 2)<strong>缓存空值</strong>：查不到也缓存 null 设短 TTL(如 60s) 3)参数校验拦截明显非法请求。"},
{type:"choice",q:"缓存击穿是什么？和穿透的区别？怎么解决？",options:["A) 缓存击穿就是缓存坏了","B) 热点 key 过期瞬间大量请求同时打到数据库；和穿透区别：穿透是查不存在的数据击穿是数据存在但缓存刚过期；解决：互斥锁(只放一个请求查 DB 其他等待) 热点 key 永不过期(逻辑过期后台异步刷新)","C) 缓存击穿和穿透是同一个问题","D) 缓存击穿不需要处理"],answer:1,explain:"<strong>口答要点</strong>：<strong>缓存击穿</strong>：热点 key 缓存过期的瞬间，大量并发请求同时打到数据库。<strong>和穿透区别</strong>：穿透是数据不存在，击穿是数据存在但缓存刚好过期。<strong>解决方案</strong>：1)<strong>互斥锁</strong>：缓存不存在时只让一个请求查 DB 其他等待结果后从缓存读 2)<strong>热点 key 永不过期</strong>：不设 TTL，用逻辑过期+后台异步刷新 3)<strong>提前刷新</strong>：在快过期时主动刷新。"},
{type:"choice",q:"缓存雪崩是什么？怎么预防和恢复？",options:["A) 缓存雪崩就是 Redis 崩溃了","B) 大量 key 同时过期或 Redis 宕机所有请求打到数据库导致数据库也崩溃；预防：TTL 加随机值避免同时过期 集群保证高可用 多级缓存(本地+Redis+DB) 限流降级；恢复：快速恢复 Redis 临时限流","C) 缓存雪崩是单个 key 过期","D) 缓存雪崩不需要预防"],answer:1,explain:"<strong>口答要点</strong>：<strong>缓存雪崩</strong>：大量 key 同时过期或 Redis 宕机→全部请求打到 DB→DB 也崩溃。<strong>预防</strong>：1)TTL 加随机值(如 base+random(0-300s))避免同时过期 2)Redis 集群/哨兵保证高可用 3)<strong>多级缓存</strong>：本地缓存(Caffeine)+Redis+DB 4)限流降级保护 DB。<strong>恢复</strong>：快速恢复 Redis、临时限流降级、逐步预热缓存。"},
{type:"choice",q:"Redis 分布式锁怎么实现？有什么坑？Redlock 算法了解吗？",options:["A) Redis 分布式锁就是 SET 一个 key","B) SET key value NX EX 30 实现互斥+过期防死锁；value 用唯一标识(UUID)释放时校验防误删；坑：锁过期但业务没完成(看门狗续期) 主从切换锁丢失；Redlock 多节点投票多数成功才算获锁","C) 分布式锁没有坑","D) Redis 分布式锁不需要过期时间"],answer:1,explain:"<strong>口答要点</strong>：<strong>基础实现</strong>：<code>SET key UUID NX EX 30</code>。释放时用 Lua 脚本校验 UUID 匹配才删除(保证原子性)。<strong>坑</strong>：1)锁过期业务没完成→看门狗(定时续期) 2)主从切换锁丢失→Redlock。<strong>Redlock</strong>(Antirez 提出)：向 N 个独立 Redis 实例加锁，多数(N/2+1)成功才算获锁。但 Martin Kleppmann 质疑其正确性(GC 停顿/时钟漂移)。<strong>推荐</strong>：简单场景用 SET NX EX，高可靠场景用 ZooKeeper/etcd。"},
{type:"choice",q:"Redis 的数据结构有哪些？各自的应用场景？",options:["A) Redis 只有 String 一种类型","B) String(缓存/计数器) List(消息队列/文章列表) Hash(对象存储) Set(标签/去重) ZSet(排行榜/延迟队列)；高级：Bitmap(签到) HyperLogLog(UV统计) Geo(地理位置) Stream(消息队列)","C) Redis 不能做排行榜","D) Redis 的 Hash 不能存储对象"],answer:1,explain:"<strong>口答要点</strong>：<strong>5 种基本类型</strong>：String(缓存/分布式锁/计数器 INCR)、List(消息队列 LPUSH+BRPOP/最新文章列表)、Hash(用户对象存储比 String 存 JSON 更节省空间)、Set(共同好友/标签去重 SADD+SINTER)、ZSet(排行榜 ZADD+ZREVRANGE/延迟队列 score=时间戳)。<strong>高级类型</strong>：Bitmap(每日签到 SETBIT)、HyperLogLog(UV 统计 PFADD 误差 0.81%)、Geo(附近的人 GEOADD)、Stream(持久化消息队列)。"},
{type:"truefalse",q:"Redis 是单线程的所以性能很差。",answer:false,explain:"<strong>口答要点</strong>：不对。Redis <strong>命令处理是单线程</strong>(6.0 后网络 I/O 多线程)但性能极高——纯内存操作 QPS 10万+。单线程的优势：避免锁竞争和上下文切换、命令原子性。瓶颈不在 CPU 而在内存和网络 I/O。"},
{type:"truefalse",q:"Redis 的 RDB 持久化是全量快照，AOF 是增量日志。",answer:true,explain:"<strong>口答要点</strong>：正确。<strong>RDB</strong>：全量快照(save/bgsave fork 子进程生成 dump.rdb)恢复快但可能丢最后一次快照后的数据。<strong>AOF</strong>：追加记录每条写命令(appendonly.aof)数据安全性高有 fsync 策略(always/everysec/no)。通常两者结合用：RDB 做全量备份 AOF 做增量。"},
]},
// ===================== 新增关卡：算法与数据结构 =====================
{id:15,name:"算法与数据结构之巅",desc:"高频算法题与数据结构",difficulty:"boss",icon:"🧮",questions:[
{type:"choice",q:"说说常见排序算法的时间复杂度和稳定性？",options:["A) 所有排序都是 O(n²)","B) 冒泡 O(n²)稳定 选择 O(n²)不稳定 插入 O(n²)稳定 快排 O(nlogn)不稳定 归并 O(nlogn)稳定 堆排 O(nlogn)不稳定 计数/桶/基数 O(n+k)稳定","C) 快排是稳定的","D) 归并排序是 O(n²)"],answer:1,explain:"<strong>口答要点</strong>：<strong>O(n²)</strong>：冒泡(稳定)、选择(不稳定)、插入(稳定)。<strong>O(nlogn)</strong>：快排(不稳定平均 O(nlogn)最坏 O(n²))、归并(稳定需 O(n) 额外空间)、堆排(不稳定原地)。<strong>O(n+k)</strong>：计数排序(整数范围小)、桶排序、基数排序。<strong>面试常考</strong>：快排(分区+递归)、归并(分治+合并)。V8 的 Array.sort 用 TimSort(归并+插入)。"},
{type:"choice",q:"二分查找的条件和实现要点？常见变体？",options:["A) 二分查找可以在无序数组上用","B) 条件：有序数组+随机访问；要点：mid=left+(right-left)/2 防溢出 循环条件 left<=right(闭区间)；变体：找第一个≥target 找最后一个≤target 旋转数组搜索 寻找峰值","C) 二分查找不需要有序","D) mid=(left+right)/2 是最佳写法"],answer:1,explain:"<strong>口答要点</strong>：<strong>条件</strong>：有序+随机访问。<strong>防溢出</strong>：<code>mid=left+(right-left)/2</code> 而不是 (left+right)/2。<strong>模板</strong>：while(left&lt;=right){mid=...;if(arr[mid]===target)return mid;if(arr[mid]&lt;target)left=mid+1;else right=mid-1}。<strong>变体</strong>：1)找第一个 ≥target(右收缩) 2)找最后一个 ≤target(左收缩) 3)旋转排序数组搜索(判断哪半有序) 4)在函数上二分(如 sqrt(x))。"},
{type:"choice",q:"链表的高频操作？反转链表/检测环/合并有序链表怎么做？",options:["A) 链表和数组操作完全一样","B) 反转：三指针(prev/curr/next)迭代或递归；检测环：快慢指针(快 2 步慢 1 步相遇有环)或 Set；合并：哑节点+双指针比较；找中点：快慢指针(快到尾慢在中点)","C) 反转链表只能用递归","D) 检测环不能用快慢指针"],answer:1,explain:"<strong>口答要点</strong>：<strong>反转链表</strong>：<code>let prev=null;while(curr){next=curr.next;curr.next=prev;prev=curr;curr=next}</code>。<strong>检测环</strong>：快慢指针——fast 走 2 步 slow 走 1 步，相遇则有环(弗洛伊德算法)。进阶：找环入口(相遇后一个从头走再相遇点为入口)。<strong>合并有序链表</strong>：哑节点(dummy)简化头节点处理，双指针比较 val 小的接上。<strong>找中点</strong>：快慢指针 fast 到尾时 slow 在中点。"},
{type:"choice",q:"二叉树的遍历方式？前/中/后/层序怎么实现？",options:["A) 二叉树只能递归遍历","B) 前序(根左右) 中序(左根右 BST 升序) 后序(左右根) 层序(BFS 队列)；递归简单 非递归用栈(前/中/后)或队列(层序)；常见题：最大深度/翻转/对称路径/最近公共祖先","C) 层序遍历用栈","D) 中序遍历 BST 得到降序序列"],answer:1,explain:"<strong>口答要点</strong>：<strong>前序</strong>(根左右)：递归或栈迭代。<strong>中序</strong>(左根右)：BST 中序遍历得到升序序列。<strong>后序</strong>(左右根)：适合计算子树信息后处理根(如求树高)。<strong>层序</strong>(BFS)：用队列逐层遍历。<strong>高频题</strong>：最大深度(后序 max(左高,右高)+1)、翻转树(交换左右子树递归)、对称树(递归比较左子树镜像右子树)、最近公共祖先(后序递归)。"},
{type:"choice",q:"什么是动态规划？核心要素？和贪心的区别？",options:["A) 动态规划就是递归","B) 将问题拆成子问题保存子问题解避免重复计算；核心要素：最优子结构+重叠子问题；状态定义→转移方程→初始值→遍历顺序；和贪心区别：DP 考虑所有选择贪心只做局部最优不回退","C) 贪心一定得到全局最优","D) DP 不需要状态定义"],answer:1,explain:"<strong>口答要点</strong>：<strong>动态规划</strong>：把问题拆成子问题，保存子问题解。<strong>核心要素</strong>：1)最优子结构(大问题最优解由子问题最优解构成) 2)重叠子问题(子问题被重复计算——DP 用数组/Map 缓存)。<strong>解题步骤</strong>：1)定义状态(dp[i] 代表什么) 2)推导转移方程 3)确定初始值和边界 4)确定遍历顺序。<strong>经典题</strong>：爬楼梯 dp[i]=dp[i-1]+dp[i-2]、背包问题、最长公共子序列、打家劫舍。<strong>和贪心区别</strong>：贪心每步做局部最优不可回退不保证全局最优；DP 考虑所有选择保证最优。"},
{type:"choice",q:"栈和队列的应用场景？用栈实现队列/用队列实现栈怎么做？",options:["A) 栈和队列功能完全一样","B) 栈 LIFO：函数调用栈/括号匹配/表达式求值/浏览器后退/DFS；队列 FIFO：任务调度/BFS/消息队列；栈实现队列：双栈(输入栈+输出栈) push 到输入栈 pop 从输出栈(空则倒);队列实现栈：双队列交替","C) 栈可以随机访问","D) 队列是 LIFO"],answer:1,explain:"<strong>口答要点</strong>：<strong>栈 LIFO</strong>：函数调用栈、括号匹配(左括号入栈右括号匹配)、表达式求值(双栈数字/运算符)、浏览器后退/前进、DFS 非递归。<strong>队列 FIFO</strong>：BFS 层序遍历、任务调度、消息队列、缓冲区。<strong>用栈实现队列</strong>：双栈——push 入 inStack，pop/peek 时如果 outStack 为空把 inStack 全部倒入 outStack 再操作(均摊 O(1))。<strong>用队列实现栈</strong>：push 后把前面的元素依次出队再入队使新元素在队头。"},
{type:"truefalse",q:"快速排序的最坏时间复杂度是 O(n²)。",answer:true,explain:"<strong>口答要点</strong>：正确。快排最坏情况(数组已排序且选第一个/最后一个作 pivot)每次只分出一个元素退化为 O(n²)。优化：随机选 pivot、三数取中(首/中/尾的中位数)、小数组用插入排序。平均 O(nlogn)且常数因子小实际最快。"},
{type:"truefalse",q:"哈希表的平均查找时间复杂度是 O(1)。",answer:true,explain:"<strong>口答要点</strong>：正确。哈希表通过哈希函数将 key 映射到数组索引，理想情况下查找/插入/删除都是 O(1)。最坏情况(哈希冲突严重所有 key 映射到同一位置)退化到 O(n)。冲突解决：链地址法(每个桶存链表/红黑树)和开放地址法(线性探测/二次探测)。Java HashMap 链表长度 ≥8 转红黑树将最坏优化到 O(logn)。"},
]},
{id:1,name:"CSS 与布局之森",desc:"CSS 布局、动画与工程化",difficulty:"easy",icon:"🎨",questions:[
{type:"choice",q:"说说 BFC 是什么？解决了什么问题？",options:["A) BFC 就是块级格式化上下文不重要","B) Block Formatting Context 独立渲染区域内部元素不受外部影响；解决 margin 塌陷、浮动溢出、清除浮动；触发：overflow:hidden display:flex/inline-block position:absolute/fixed","C) BFC 只能用 overflow:hidden 触发","D) BFC 和浮动没有关系"],answer:1,explain:"<strong>口答要点</strong>：BFC 是独立渲染区域，内部元素不影响外部。<strong>触发</strong>：overflow 非 visible、display 为 flex/grid/inline-block、position 为 absolute/fixed、float 非 none。<strong>解决</strong>：1)margin 塌陷 2)清除浮动 3)避免文字环绕。"},
{type:"choice",q:"Flex 布局中 flex: 1 代表什么？",options:["A) flex: 1 就是宽度为 1px","B) flex: 1 是 flex-grow:1/flex-shrink:1/flex-basis:0% 的简写表示元素自动伸缩填充剩余空间","C) flex: 1 表示元素不可缩放","D) flex: 1 和 flex-grow:1 完全等价"],answer:1,explain:"<strong>口答要点</strong>：flex:1 是三个属性简写——<strong>flex-grow:1</strong>(有剩余空间等比例放大)、<strong>flex-shrink:1</strong>(空间不足等比例缩小)、<strong>flex-basis:0%</strong>(初始大小为 0 完全依赖 grow 分配)。和 flex-grow:1 区别：flex:1 的 basis 是 0% 不考虑自身内容大小。"},
{type:"choice",q:"如何实现水平垂直居中？说几种方式。",options:["A) 只能用 margin:auto","B) 1)Flex: display:flex justify-content:center align-items:center 2)Grid: display:grid place-items:center 3)绝对定位+transform: top:50% left:50% transform:translate(-50%,-50%)","C) text-align:center 就能垂直居中","D) line-height 只能水平居中"],answer:1,explain:"<strong>口答要点</strong>：最常用两种：1)<strong>Flex</strong>推荐：display:flex;justify-content:center;align-items:center 一行搞定。2)<strong>Grid</strong>：display:grid;place-items:center 更简洁。3)绝对定位+transform 适合不确定子元素大小的情况。"},
{type:"choice",q:"重排（reflow）和重绘（repaint）的区别？如何优化？",options:["A) 没区别都是重新渲染","B) 重排：元素大小/位置变化需重新计算布局代价大；重绘：外观变化(颜色/背景)不改变布局代价小；优化：用 transform 代替 top/left opacity 代替 visibility 避免频繁读取布局属性用 requestAnimationFrame","C) 改变颜色会触发重排","D) transform 会触发重排"],answer:1,explain:"<strong>口答要点</strong>：<strong>重排</strong>：几何属性变化(宽高/位置/显示隐藏)触发需重新计算布局代价大。<strong>重绘</strong>：外观变化(颜色/背景)触发不改变布局代价小。<strong>优化</strong>：用 transform/opacity 做动画走合成层不触发重排重绘；避免逐条修改样式用 class 切换；避免频繁读取 offsetTop 等强制重排属性。"},
{type:"choice",q:"CSS 选择器优先级是怎么计算的？",options:["A) 按代码顺序后面的优先","B) !important > 内联(1000) > ID(100) > 类/伪类/属性(10) > 标签/伪元素(1) > 通配符(0)；同优先级后写的覆盖先写的","C) class 的优先级比 ID 高","D) !important 可以被任何选择器覆盖"],answer:1,explain:"<strong>口答要点</strong>：从高到低：!important > 内联 style(1000) > ID(100) > 类/伪类/属性(10) > 标签/伪元素(1) > 通配符(0)。同权重后写覆盖先写。建议尽量用 class 选择器避免 !important 和内联样式。"},
{type:"choice",q:"响应式布局有哪些实现方案？",options:["A) 只能用 Bootstrap","B) 1)媒体查询 @media 2)Flex/Grid 弹性布局 3)rem/em/vw/vh 相对单位 4)CSS Container Queries(新特性) 5)picture 标签适配不同分辨率","C) 响应式布局就是缩小页面","D) 只能用 JS 计算屏幕宽度"],answer:1,explain:"<strong>口答要点</strong>：1)<strong>媒体查询</strong>：@media (max-width:768px) 针对不同断点写样式。2)<strong>弹性布局</strong>：Flex 和 Grid 自适应。3)<strong>相对单位</strong>：rem、vw/vh。4)<strong>容器查询</strong>：根据父容器大小适配(较新)。通常是媒体查询+Flex/Grid+rem 的组合。"},
{type:"truefalse",q:"CSS 中 position:sticky 是 relative 和 fixed 的结合体。",answer:true,explain:"<strong>口答要点</strong>：正确。sticky 元素滚动到指定阈值前表现为 relative，达到阈值后变为 fixed 固定。需设置 top/left/right/bottom 之一才生效。常见用途：表头吸顶、侧边栏滚动固定。父元素不能有 overflow:hidden 否则 sticky 失效。"},
{type:"truefalse",q:"transition 和 animation 都需要触发条件才能开始动画。",answer:false,explain:"<strong>口答要点</strong>：不对。transition 需要<strong>触发条件</strong>(如 hover)只有起始和结束两个状态。animation <strong>不需要触发</strong>可以自动开始循环暂停，支持 @keyframes 定义多个中间状态。简单状态过渡用 transition，复杂动画用 animation。"},
{type:"choice",q:"CSS 中 ::before 和 :before 有什么区别？伪元素和伪类的区别？",options:["A) 完全一样只是写法不同","B) ::before 是伪元素(CSS3 语法双冒号)创建虚拟元素需配 content 属性；:hover 是伪类(单冒号)表示元素状态；伪元素创建新内容伪类选择已有元素的状态","C) 伪元素不需要 content 属性","D) 伪类可以创建新元素"],answer:1,explain:"<strong>口答要点</strong>：<strong>伪元素</strong>(::双冒号 CSS3)：创建不存在于 DOM 的虚拟元素——::before/::after/::first-line/::first-letter。必须设 content 属性(即使空字符串)。<strong>伪类</strong>(:单冒号)：选择元素的特定状态——:hover/:focus/:nth-child/:checked/:not()。CSS2 中都单冒号，CSS3 伪元素改双冒号以区分。"},
{type:"choice",q:"CSS 中 grid 布局的核心概念？和 flex 的区别？",options:["A) grid 和 flex 完全一样","B) grid 是二维布局(行+列)适合整体页面布局；flex 是一维布局(行或列)适合组件内部排列；grid 核心：grid-template-columns/rows repeat() fr 单位 minmax() gap grid-area","C) flex 可以做二维布局","D) grid 不能设间距"],answer:1,explain:"<strong>口答要点</strong>：<strong>Grid</strong>：二维布局——grid-template-columns(列定义) / grid-template-rows(行定义) / gap(间距) / grid-area(区域命名) / repeat(auto-fill, minmax(200px, 1fr))(自适应列)。<strong>Flex</strong>：一维布局——主轴方向排列。<strong>选择</strong>：页面整体布局用 Grid(二维)，组件内部排列用 Flex(一维)。"},
{type:"truefalse",q:"CSS 的 will-change 属性可以提示浏览器提前优化，但不应滥用。",answer:true,explain:"<strong>口答要点</strong>：正确。will-change 告诉浏览器某属性即将变化，浏览器可提前创建合成层/GPU 缓冲优化。但<strong>不应滥用</strong>——每个 will-change 都消耗内存和 GPU 资源。只在确实需要优化的动画元素上用，动画结束后移除。常见值：will-change: transform/opacity/scroll-position。"},
]},
