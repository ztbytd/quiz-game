server {
    listen 8088;
    server_name _;
    root /var/www/quiz;
    index index.html;

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /release.json {
        add_header Cache-Control "no-store";
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
