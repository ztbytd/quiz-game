<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>面试闯关 · 前端勇士的冒险</title>
<style>
:root {
  --primary: #58cc02;
  --primary-dark: #46a302;
  --primary-light: #d7ffb8;
  --blue: #1cb0f6;
  --blue-dark: #0a92d9;
  --purple: #ce82ff;
  --purple-dark: #a860e0;
  --red: #ff4b4b;
  --red-dark: #e03838;
  --orange: #ff9600;
  --gold: #ffc800;
  --bg: #f7f7f7;
  --card-bg: #ffffff;
  --text: #3c3c3c;
  --text-light: #777777;
  --border: #e5e5e5;
  --shadow: 0 2px 0 rgba(0,0,0,0.1);
  --shadow-lg: 0 4px 0 rgba(0,0,0,0.15);
  --radius: 16px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  user-select: none;
  -webkit-user-select: none;
}

/* ============ 顶部状态栏 ============ */
.top-bar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--card-bg);
  border-bottom: 1px solid var(--border);
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: var(--shadow);
}

.top-bar .title {
  font-size: 18px;
  font-weight: 800;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
}

.top-bar .stats {
  display: flex;
  gap: 16px;
  align-items: center;
}

.stat-pill {
  display: flex;
  align-items: center;
  gap: 6px;
  font-weight: 700;
  font-size: 14px;
  padding: 6px 14px;
  border-radius: 20px;
  background: #f0f0f0;
}

.stat-pill.hearts { color: var(--red); }
.stat-pill.xp { color: var(--gold); }
.stat-pill.streak { color: var(--orange); }

.stat-pill .icon { font-size: 18px; }

/* ============ 关卡地图 ============ */
.map-container {
  max-width: 720px;
  margin: 0 auto;
  padding: 32px 20px 100px;
  position: relative;
}

.map-path {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
}

.level-node {
  position: relative;
  margin-bottom: 28px;
  z-index: 1;
}

.level-btn {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  font-size: 28px;
  font-weight: 800;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  transition: transform 0.15s;
  box-shadow: var(--shadow-lg);
}

.level-btn:hover:not(:disabled) {
  transform: translateY(-2px);
}

.level-btn:active:not(:disabled) {
  transform: translateY(2px);
  box-shadow: var(--shadow);
}

.level-btn.completed {
  background: var(--primary);
  border-bottom: 4px solid var(--primary-dark);
}

.level-btn.current {
  background: var(--gold);
  border-bottom: 4px solid #e0b000;
  animation: pulse 1.5s ease-in-out infinite;
}

.level-btn.locked {
  background: #c8c8c8;
  border-bottom: 4px solid #aaa;
  cursor: not-allowed;
  opacity: 0.6;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.08); }
}

.level-btn .star-badge {
  position: absolute;
  top: -8px;
  right: -8px;
  background: var(--blue);
  color: white;
  border-radius: 12px;
  padding: 2px 8px;
  font-size: 11px;
  font-weight: 800;
  border: 2px solid white;
}

.level-btn .lock-icon {
  font-size: 24px;
  opacity: 0.7;
}

/* 连接线 */
.connector {
  width: 4px;
  height: 24px;
  background: #ddd;
  margin: -14px 0 -14px 0;
  border-radius: 2px;
}

.connector.done { background: var(--primary); }

/* 关卡标签 */
.level-label {
  position: absolute;
  left: 90px;
  top: 50%;
  transform: translateY(-50%);
  white-space: nowrap;
}

.level-label .name {
  font-size: 15px;
  font-weight: 800;
  color: var(--text);
}

.level-label .desc {
  font-size: 12px;
  color: var(--text-light);
  margin-top: 2px;
}

.level-label .tag {
  display: inline-block;
  font-size: 10px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 10px;
  margin-top: 4px;
}

.tag-easy { background: var(--primary-light); color: var(--primary-dark); }
.tag-medium { background: #fff3d6; color: #c4860a; }
.tag-hard { background: #ffe0e0; color: var(--red-dark); }
.tag-boss { background: #f0e0ff; color: var(--purple-dark); }

/* 交替左右 */
.level-node:nth-child(even) .level-label {
  left: auto;
  right: 90px;
  text-align: right;
}

/* ============ 答题界面 ============ */
.quiz-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.3);
  z-index: 200;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.quiz-overlay.active { display: flex; }

.quiz-card {
  background: var(--card-bg);
  border-radius: 24px;
  max-width: 640px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 8px 30px rgba(0,0,0,0.2);
  animation: slideUp 0.3s ease;
}

@keyframes slideUp {
  from { transform: translateY(30px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.quiz-header {
  padding: 16px 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.quiz-header .progress-bar {
  flex: 1;
  height: 10px;
  background: #eee;
  border-radius: 5px;
  margin-right: 16px;
  overflow: hidden;
}

.quiz-header .progress-fill {
  height: 100%;
  background: var(--primary);
  border-radius: 5px;
  transition: width 0.3s;
}

.quiz-header .close-btn {
  background: none;
  border: none;
  font-size: 22px;
  cursor: pointer;
  color: var(--text-light);
  padding: 4px 8px;
}

.quiz-body {
  padding: 24px;
}

.question-type {
  font-size: 12px;
  font-weight: 800;
  color: var(--blue);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 8px;
}

.question-text {
  font-size: 20px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.5;
  margin-bottom: 24px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.option-btn {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 20px;
  border: 2px solid var(--border);
  border-radius: 16px;
  background: white;
  cursor: pointer;
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  transition: all 0.15s;
  text-align: left;
  line-height: 1.4;
}

.option-btn:hover {
  border-color: var(--blue);
  background: #f0faff;
}

.option-btn .opt-key {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 2px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 14px;
  color: var(--text-light);
  flex-shrink: 0;
}

.option-btn.selected {
  border-color: var(--blue);
  background: #f0faff;
}

.option-btn.selected .opt-key {
  border-color: var(--blue);
  background: var(--blue);
  color: white;
}

.option-btn.correct {
  border-color: var(--primary);
  background: var(--primary-light);
}

.option-btn.correct .opt-key {
  border-color: var(--primary);
  background: var(--primary);
  color: white;
}

.option-btn.wrong {
  border-color: var(--red);
  background: #ffe0e0;
}

.option-btn.wrong .opt-key {
  border-color: var(--red);
  background: var(--red);
  color: white;
}

/* 简答题输入 */
.text-input {
  width: 100%;
  padding: 16px;
  border: 2px solid var(--border);
  border-radius: 16px;
  font-size: 15px;
  font-family: inherit;
  min-height: 100px;
  resize: vertical;
  transition: border-color 0.15s;
  line-height: 1.5;
}

.text-input:focus {
  outline: none;
  border-color: var(--blue);
}

/* 判断题 */
.true-false {
  display: flex;
  gap: 12px;
}

.true-false .option-btn {
  flex: 1;
  justify-content: center;
}

/* 答题反馈 */
.feedback {
  margin-top: 20px;
  padding: 16px 20px;
  border-radius: 16px;
  display: none;
  animation: slideUp 0.2s ease;
}

.feedback.show { display: block; }

.feedback.correct {
  background: var(--primary-light);
  border: 2px solid var(--primary);
}

.feedback.wrong {
  background: #ffe0e0;
  border: 2px solid var(--red);
}

.feedback .result-icon {
  font-size: 20px;
  font-weight: 800;
  margin-bottom: 8px;
}

.feedback.correct .result-icon { color: var(--primary-dark); }
.feedback.wrong .result-icon { color: var(--red-dark); }

.feedback .explanation {
  font-size: 14px;
  color: var(--text);
  line-height: 1.6;
}

.feedback .explanation strong {
  color: var(--text);
}

/* 底部按钮 */
.quiz-footer {
  padding: 16px 24px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.btn {
  padding: 12px 32px;
  border: none;
  border-radius: 14px;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  transition: transform 0.1s;
}

.btn:active { transform: translateY(1px); }

.btn-primary {
  background: var(--primary);
  color: white;
  border-bottom: 4px solid var(--primary-dark);
}

.btn-primary:hover { background: var(--primary-dark); }
.btn-primary:disabled {
  background: #ccc;
  border-bottom-color: #aaa;
  cursor: not-allowed;
}

.btn-secondary {
  background: #fff;
  color: var(--blue);
  border: 2px solid var(--border);
}

.btn-secondary:hover { border-color: var(--blue); }

/* ============ 通关动画 ============ */
.victory-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  z-index: 300;
  display: none;
  align-items: center;
  justify-content: center;
}

.victory-overlay.active { display: flex; }

.victory-card {
  background: white;
  border-radius: 24px;
  padding: 40px;
  max-width: 400px;
  width: 90%;
  text-align: center;
  animation: bounceIn 0.5s ease;
}

@keyframes bounceIn {
  0% { transform: scale(0.5); opacity: 0; }
  60% { transform: scale(1.05); }
  100% { transform: scale(1); opacity: 1; }
}

.victory-card .trophy {
  font-size: 64px;
  margin-bottom: 12px;
  animation: trophyShake 0.8s ease;
}

@keyframes trophyShake {
  0%, 100% { transform: rotate(0); }
  25% { transform: rotate(-15deg); }
  75% { transform: rotate(15deg); }
}

.victory-card h2 {
  font-size: 24px;
  font-weight: 800;
  margin-bottom: 8px;
  color: var(--text);
}

.victory-card .subtitle {
  font-size: 14px;
  color: var(--text-light);
  margin-bottom: 24px;
}

.victory-card .rewards {
  display: flex;
  justify-content: center;
  gap: 24px;
  margin-bottom: 28px;
}

.reward-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

.reward-item .reward-icon { font-size: 32px; }
.reward-item .reward-val { font-size: 18px; font-weight: 800; }
.reward-item .reward-label { font-size: 11px; color: var(--text-light); }

/* ============ 成就系统 ============ */
.achievement-toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--purple);
  color: white;
  padding: 12px 24px;
  border-radius: 16px;
  font-weight: 700;
  font-size: 14px;
  z-index: 400;
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  display: flex;
  align-items: center;
  gap: 8px;
  transition: transform 0.3s ease;
}

.achievement-toast.show {
  transform: translateX(-50%) translateY(0);
}

/* ============ 开场画面 ============ */
.start-screen {
  text-align: center;
  padding: 60px 20px;
  max-width: 600px;
  margin: 0 auto;
}

.start-screen .hero-icon {
  font-size: 72px;
  margin-bottom: 16px;
  animation: bounceIn 0.6s ease;
}

.start-screen h1 {
  font-size: 28px;
  font-weight: 800;
  margin-bottom: 8px;
}

.start-screen .subtitle {
  font-size: 16px;
  color: var(--text-light);
  margin-bottom: 32px;
}

.start-screen .player-card {
  background: white;
  border-radius: 20px;
  padding: 24px;
  box-shadow: var(--shadow);
  margin-bottom: 24px;
  text-align: left;
}

.start-screen .player-card .row {
  display: flex;
  justify-content: space-between;
  padding: 8px 0;
  border-bottom: 1px solid #f0f0f0;
}

.start-screen .player-card .row:last-child { border-bottom: none; }

.start-screen .player-card .label { color: var(--text-light); font-size: 14px; }
.start-screen .player-card .value { font-weight: 700; font-size: 14px; }

/* 提示气泡 */
.tip-bubble {
  background: #fff;
  border: 2px solid var(--border);
  border-radius: 16px;
  padding: 14px 18px;
  font-size: 14px;
  color: var(--text-light);
  margin: 16px 0;
  position: relative;
}

.tip-bubble::before {
  content: '💡';
  margin-right: 6px;
}

/* 响应式 */
@media (max-width: 480px) {
  .level-label .desc { display: none; }
  .level-btn { width: 60px; height: 60px; font-size: 22px; }
  .question-text { font-size: 17px; }
  .top-bar .title { font-size: 15px; }
  .stat-pill { font-size: 12px; padding: 4px 10px; }
}
</style>
</head>
<body>

<!-- 顶部状态栏 -->
<div class="top-bar">
  <div class="title">⚔️ 前端勇士的面试冒险</div>
  <div class="stats">
    <div class="stat-pill hearts"><span class="icon">❤️</span><span id="hearts">5</span></div>
    <div class="stat-pill xp"><span class="icon">⭐</span><span id="xp">0</span></div>
    <div class="stat-pill streak"><span class="icon">🔥</span><span id="streak">0</span></div>
  </div>
</div>

<!-- 开场画面 -->
<div id="startScreen" class="start-screen">
  <div class="hero-icon">🛡️</div>
  <h1>前端勇士的面试冒险</h1>
  <p class="subtitle">基于你的简历量身定制 · 闯关式面试模拟</p>

  <div class="player-card">
    <div class="row"><span class="label">玩家</span><span class="value">叶正雄</span></div>
    <div class="row"><span class="label">职业</span><span class="value">高级前端工程师（5年）</span></div>
    <div class="row"><span class="label">待解锁关卡</span><span class="value">8 个</span></div>
    <div class="row"><span class="label">目标</span><span class="value">下周一面试 · 满状态出战</span></div>
  </div>

  <div class="tip-bubble">每关 3~5 道题，答错扣 1 颗心，通关获得 XP 和星星。连续答对会有连击加成！</div>

  <button class="btn btn-primary" onclick="startGame()">开始冒险</button>
</div>

<!-- 关卡地图 -->
<div id="mapContainer" class="map-container" style="display:none;">
  <div class="map-path" id="mapPath"></div>
</div>

<!-- 答题界面 -->
<div id="quizOverlay" class="quiz-overlay">
  <div class="quiz-card">
    <div class="quiz-header">
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <button class="close-btn" onclick="quitQuiz()">✕</button>
    </div>
    <div class="quiz-body" id="quizBody"></div>
    <div class="quiz-footer" id="quizFooter">
      <span style="color:var(--text-light);font-size:13px;" id="quizHint">选择你认为正确的答案</span>
      <button class="btn btn-primary" id="checkBtn" onclick="checkAnswer()" disabled>确认</button>
    </div>
  </div>
</div>

<!-- 通关画面 -->
<div id="victoryOverlay" class="victory-overlay">
  <div class="victory-card">
    <div class="trophy" id="trophyIcon">🏆</div>
    <h2 id="victoryTitle">关卡通过！</h2>
    <p class="subtitle" id="victorySubtitle">你离面试成功又近了一步</p>
    <div class="rewards">
      <div class="reward-item">
        <div class="reward-icon">⭐</div>
        <div class="reward-val" id="rewardXp">+50</div>
        <div class="reward-label">经验值</div>
      </div>
      <div class="reward-item">
        <div class="reward-icon">🌟</div>
        <div class="reward-val" id="rewardStars">3</div>
        <div class="reward-label">星数</div>
      </div>
    </div>
    <button class="btn btn-primary" onclick="closeVictory()">继续冒险</button>
  </div>
</div>

<!-- 成就提示 -->
<div id="achievementToast" class="achievement-toast">
  <span>🏅</span><span id="achievementText">成就解锁</span>
</div>

<script>
// ============ 游戏数据 ============
const LEVELS = [
  {
    id: 0,
    name: "技术基础村",
    desc: "Vue / React / TS 基础概念",
    difficulty: "easy",
    icon: "🌱",
    questions: [
      {
        type: "choice",
        question: "Vue3 相比 Vue2 的 Composition API，最大的优势是什么？",
        options: [
          "A) 运行时性能提升10倍以上",
          "B) 逻辑复用更灵活，按功能组织代码而非按选项类型",
          "C) 不再需要 Vue Router，路由内置",
          "D) 完全兼容 Vue2 的所有写法，零迁移成本"
        ],
        answer: 1,
        explanation: "Composition API 的核心优势是<strong>按逻辑功能组织代码</strong>，解决了 Options API 下相关逻辑散落在 data/methods/computed 中的问题。逻辑复用从 mixin 升级为 composable 函数，更清晰、更安全（无命名冲突）。性能提升确实有，但不是主要卖点。"
      },
      {
        type: "choice",
        question: "React 中 useMemo 和 useCallback 的区别？什么场景下应该使用？",
        options: [
          "A) 没有区别，只是名字不同",
          "B) useMemo 缓存计算结果，useCallback 缓存函数引用；用于避免子组件不必要的重新渲染",
          "C) useMemo 只能用于数字，useCallback 只能用于字符串",
          "D) 两者都应该在每次渲染时调用以确保最新"
        ],
        answer: 1,
        explanation: "<strong>useMemo</strong> 缓存的是<strong>计算结果值</strong>，<strong>useCallback</strong> 缓存的是<strong>函数引用</strong>。核心场景：把值/函数传给被 React.memo 包裹的子组件时，避免因引用变化触发子组件重渲染。<strong>不要滥用</strong>——缓存本身有开销，简单计算或未传给子组件的场景不需要。"
      },
      {
        type: "choice",
        question: "TypeScript 中 type 和 interface 的区别？你项目中更倾向用哪个？",
        options: [
          "A) 完全一样，随便用",
          "B) interface 只能描述对象类型，type 可以描述联合、交叉、元组等；interface 支持声明合并，type 不支持",
          "C) type 是编译时的，interface 是运行时的",
          "D) interface 性能更好，应该永远用 interface"
        ],
        answer: 1,
        explanation: "<strong>interface</strong> 支持声明合并（同名自动合并），适合定义对象/类的形状。<strong>type</strong> 更灵活，支持联合类型、交叉类型、映射类型等。实际项目中：API 响应类型、组件 Props 用 interface；工具类型、联合类型用 type。你的简历中提到 BFF 层共享 TypeScript 类型定义，面试官可能会追问这里的实践。"
      },
      {
        type: "choice",
        question: "Vue3 的 ref 和 reactive 有什么区别？什么场景下用哪个？",

// ============ 游戏状态 ============
let gameState = {
  hearts: 5,
  xp: 0,
  streak: 0,
  currentLevel: null,
  currentQuestion: 0,
  selectedAnswer: null,
  answered: false,
  levelStars: {},
  achievements: [],
  comboCount: 0
};

// ============ 初始化 ============
function startGame() {
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('mapContainer').style.display = 'block';
  renderMap();
  updateStats();
}

function renderMap() {
  const path = document.getElementById('mapPath');
  path.innerHTML = '';

  LEVELS.forEach((level, idx) => {
    const prevDone = idx === 0 || gameState.levelStars[idx - 1] !== undefined;
    const done = gameState.levelStars[idx] !== undefined;

    // 连接线
    if (idx > 0) {
      const conn = document.createElement('div');
      conn.className = 'connector' + (done ? ' done' : '');
      path.appendChild(conn);
    }

    // 关卡节点
    const node = document.createElement('div');
    node.className = 'level-node';

    const btn = document.createElement('button');
    btn.className = 'level-btn';
    if (done) {
      btn.classList.add('completed');
      btn.innerHTML = level.icon;
      const stars = document.createElement('div');
      stars.className = 'star-badge';
      stars.textContent = '★ ' + gameState.levelStars[idx];
      btn.appendChild(stars);
    } else if (prevDone) {
      btn.classList.add('current');
      btn.textContent = idx + 1;
    } else {
      btn.classList.add('locked');
      btn.innerHTML = '<span class="lock-icon">🔒</span>';
    }

    if (prevDone && !done) {
      btn.onclick = () => startLevel(idx);
    }

    node.appendChild(btn);

    // 标签
    const label = document.createElement('div');
    label.className = 'level-label';

    const tagClass = level.difficulty === 'easy' ? 'tag-easy' :
                     level.difficulty === 'medium' ? 'tag-medium' :
                     level.difficulty === 'hard' ? 'tag-hard' : 'tag-boss';
    const tagText = level.difficulty === 'easy' ? '入门' :
                    level.difficulty === 'medium' ? '进阶' :
                    level.difficulty === 'hard' ? '困难' : 'BOSS';

    label.innerHTML = `
      <div class="name">${level.icon} ${level.name}</div>
      <div class="desc">${level.desc}</div>
      <div class="tag ${tagClass}">${tagText} · ${level.questions.length}题</div>
    `;

    node.appendChild(label);
    path.appendChild(node);
  });
}

function updateStats() {
  document.getElementById('hearts').textContent = gameState.hearts;
  document.getElementById('xp').textContent = gameState.xp;
  document.getElementById('streak').textContent = gameState.streak;
}

// ============ 开始关卡 ============
function startLevel(levelIdx) {
  if (gameState.hearts <= 0) {
    alert('心碎了！休息一下再来吧 ❤️‍🩹（刷新页面恢复）');
    return;
  }

  gameState.currentLevel = levelIdx;
  gameState.currentQuestion = 0;
  gameState.selectedAnswer = null;
  gameState.answered = false;
  gameState.comboCount = 0;

  document.getElementById('quizOverlay').classList.add('active');
  renderQuestion();
}

function renderQuestion() {
  const level = LEVELS[gameState.currentLevel];
  const q = level.questions[gameState.currentQuestion];

  // 进度条
  const progress = (gameState.currentQuestion / level.questions.length) * 100;
  document.getElementById('progressFill').style.width = progress + '%';

  // 题目区域
  const body = document.getElementById('quizBody');
  const typeLabel = q.type === 'choice' ? '选择题' :
                    q.type === 'truefalse' ? '判断题' : '简答题';

  let html = `
    <div class="question-type">${typeLabel} · 第 ${gameState.currentQuestion + 1}/${level.questions.length} 题</div>
    <div class="question-text">${q.question}</div>
  `;

  if (q.type === 'choice') {
    html += '<div class="options">';
    q.options.forEach((opt, i) => {
      const key = String.fromCharCode(65 + i);
      html += `
        <button class="option-btn" data-idx="${i}" onclick="selectOption(${i})">
          <span class="opt-key">${key}</span>
          <span>${opt.substring(3)}</span>
        </button>
      `;
    });
    html += '</div>';
  } else if (q.type === 'truefalse') {
    html += `
      <div class="options true-false">
        <button class="option-btn" data-idx="1" onclick="selectOption(1)">
          <span class="opt-key">✓</span>
          <span>正确</span>
        </button>
        <button class="option-btn" data-idx="0" onclick="selectOption(0)">
          <span class="opt-key">✗</span>
          <span>错误</span>
        </button>
      </div>
    `;
  } else if (q.type === 'text') {
    html += `
      <div class="options">
        <textarea class="text-input" id="textAnswer" placeholder="在这里输入你的答案...（写完点击确认查看参考答案）"></textarea>
      </div>
    `;
  }

  html += `<div class="feedback" id="feedback"></div>`;

  body.innerHTML = html;

  // 重置状态
  gameState.selectedAnswer = null;
  gameState.answered = false;

  // 底部按钮
  const checkBtn = document.getElementById('checkBtn');
  const hint = document.getElementById('quizHint');

  if (q.type === 'text') {
    checkBtn.textContent = '查看参考答案';
    checkBtn.disabled = false;
    hint.textContent = '简答题没有标准答案，写完点击查看参考思路';
  } else {
    checkBtn.textContent = '确认';
    checkBtn.disabled = true;
    hint.textContent = '选择你认为正确的答案';
  }

  document.getElementById('feedback').classList.remove('show');
}

function selectOption(idx) {
  if (gameState.answered) return;

  const btns = document.querySelectorAll('.option-btn');
  btns.forEach(b => b.classList.remove('selected'));
  btns[idx].classList.add('selected');

  gameState.selectedAnswer = idx;
  document.getElementById('checkBtn').disabled = false;
}

function checkAnswer() {
  const level = LEVELS[gameState.currentLevel];
  const q = level.questions[gameState.currentQuestion];
  const feedback = document.getElementById('feedback');

  if (q.type === 'text') {
    // 简答题：直接展示参考答案
    feedback.className = 'feedback show correct';
    feedback.innerHTML = `
      <div class="result-icon">💡 参考思路</div>
      <div class="explanation">${q.explanation}</div>
    `;
    gameState.answered = true;
    document.getElementById('checkBtn').textContent = '继续';
    document.getElementById('quizHint').textContent = '参考思路不是唯一答案，结合自己理解发挥';
    return;
  }

  if (gameState.selectedAnswer === null) return;

  gameState.answered = true;
  const correct = gameState.selectedAnswer === q.answer;

  // 标记选项
  const btns = document.querySelectorAll('.option-btn');
  btns.forEach((b, i) => {
    b.style.pointerEvents = 'none';
    if (i === q.answer) b.classList.add('correct');
    if (i === gameState.selectedAnswer && !correct) b.classList.add('wrong');
  });

  if (correct) {
    gameState.comboCount++;
    const baseXp = level.difficulty === 'easy' ? 10 : level.difficulty === 'medium' ? 15 : level.difficulty === 'hard' ? 20 : 30;
    const comboBonus = gameState.comboCount > 1 ? gameState.comboCount * 5 : 0;
    const totalXp = baseXp + comboBonus;

    gameState.xp += totalXp;
    gameState.streak++;

    let comboText = '';
    if (gameState.comboCount >= 3) {
      comboText = ` 🔥 ${gameState.comboCount}连击！+${comboBonus}XP`;
    }

    feedback.className = 'feedback show correct';
    feedback.innerHTML = `
      <div class="result-icon">✅ 答对了！+${totalXp} XP${comboText}</div>
      <div class="explanation">${q.explanation}</div>
    `;
  } else {
    gameState.comboCount = 0;
    gameState.hearts--;
    gameState.streak = 0;

    feedback.className = 'feedback show wrong';
    const correctText = q.type === 'truefalse'
      ? (q.answer ? '正确' : '错误')
      : q.options[q.answer].substring(3);
    feedback.innerHTML = `
      <div class="result-icon">❌ 答错了！-1 ❤️</div>
      <div class="explanation"><strong>正确答案：${correctText}</strong><br><br>${q.explanation}</div>
    `;

    if (gameState.hearts <= 0) {
      setTimeout(() => {
        alert('💔 心碎了！没关系，知识点都在解析里，刷新页面重新挑战！');
        quitQuiz();
      }, 2000);
    }
  }

  updateStats();
  checkAchievements();

  document.getElementById('checkBtn').textContent = gameState.currentQuestion < level.questions.length - 1 ? '下一题' : '完成关卡';
  document.getElementById('checkBtn').disabled = false;
  document.getElementById('quizHint').textContent = '';
}

// 点击确认/继续/下一题
document.getElementById('checkBtn').onclick = function() {
  const level = LEVELS[gameState.currentLevel];

  if (!gameState.answered) {
    checkAnswer();
    return;
  }

  // 已回答，进入下一题或完成
  gameState.currentQuestion++;

  if (gameState.currentQuestion < level.questions.length) {
    renderQuestion();
  } else {
    // 关卡完成
    completeLevel();
  }
};

function completeLevel() {
  const level = LEVELS[gameState.currentLevel];

  // 计算星数
  let stars = 3;
  const totalQ = level.questions.length;
  if (gameState.hearts <= 2) stars = 2;
  if (gameState.hearts <= 1) stars = 1;

  gameState.levelStars[gameState.currentLevel] = stars;

  // 奖励 XP
  const levelXp = level.difficulty === 'easy' ? 50 : level.difficulty === 'medium' ? 80 : level.difficulty === 'hard' ? 120 : 200;
  gameState.xp += levelXp;

  // 显示通关画面
  const overlay = document.getElementById('victoryOverlay');
  const isLast = gameState.currentLevel === LEVELS.length - 1;

  document.getElementById('trophyIcon').textContent = isLast ? '👑' : '🏆';
  document.getElementById('victoryTitle').textContent = isLast ? '面试 BOSS 已通关！' : `${level.name} 通关！`;
  document.getElementById('victorySubtitle').textContent = isLast ? '你已准备好迎接周一的面试了！' : '你离面试成功又近了一步';
  document.getElementById('rewardXp').textContent = '+' + levelXp;
  document.getElementById('rewardStars').textContent = stars + ' / 3';

  overlay.classList.add('active');
  document.getElementById('quizOverlay').classList.remove('active');

  updateStats();
  checkAchievements();
}

function closeVictory() {
  document.getElementById('victoryOverlay').classList.remove('active');
  renderMap();
}

function quitQuiz() {
  document.getElementById('quizOverlay').classList.remove('active');
}

// ============ 成就系统 ============
function checkAchievements() {
  const achievements = [
    { id: 'first_blood', cond: () => gameState.xp > 0, icon: '🎯', text: '初出茅庐：获得第一笔经验值' },
    { id: 'combo3', cond: () => gameState.comboCount >= 3, icon: '🔥', text: '三连击！答对3题不间断' },
    { id: 'level3', cond: () => Object.keys(gameState.levelStars).length >= 3, icon: '🗺️', text: '探险家：通关3个关卡' },
    { id: 'all_clear', cond: () => Object.keys(gameState.levelStars).length === LEVELS.length, icon: '👑', text: '面试大师：全部通关！' },
    { id: 'xp500', cond: () => gameState.xp >= 500, icon: '⭐', text: '经验丰富的战士：累计500 XP' },
  ];

  achievements.forEach(a => {
    if (!gameState.achievements.includes(a.id) && a.cond()) {
      gameState.achievements.push(a.id);
      showAchievement(a.icon, a.text);
    }
  });
}

function showAchievement(icon, text) {
  const toast = document.getElementById('achievementToast');
  toast.querySelector('span').textContent = icon;
  document.getElementById('achievementText').textContent = text;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}
