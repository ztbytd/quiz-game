<head>

<title>面试闯关 · 前端勇士的冒险</title>
<style>
:root {
  /* Surfaces and text: warm paper neutrals shared with practice.css */
  --bg: #f7f8f3;
  --card-bg: #fff;
  --text: #182d2a;
  --text-light: #4b625b;
  --border: #cbd6cd;
  --line-soft: #e4ebe7;
  --surface-soft: #eef5eb;
  --surface-sunk: #eaf0e6;

  /* Brand: deep green with lime accent */
  --primary: #12604e;
  --primary-dark: #0d4a3c;
  --primary-light: #e3f0e6;

  /* Status colours kept muted so the page reads as one system */
  --blue: #2c6f8f;
  --red: #a63d3d;
  --red-dark: #8a3131;
  --red-light: #fbeaea;
  --orange: #b36118;
  --orange-light: #fbf0e3;
  --purple: #6b5a8e;
  --purple-light: #efeaf6;
  --gold: #c99a2e;
  --gold-light: #fdf4e0;

  --shadow: 0 1px 2px rgba(24, 45, 42, 0.07);
  --shadow-lg: 0 4px 16px rgba(24, 45, 42, 0.12);
  --radius-sm: 8px;
  --radius: 12px;
  --radius-lg: 18px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter','Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;user-select:none;-webkit-user-select:none;line-height:1.6}

/* ---------- Top bar ---------- */
.top-bar{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top-bar .title{font-size:17px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.top-bar .stats{display:flex;gap:8px;align-items:center}
.stat-pill{display:flex;align-items:center;gap:6px;font-weight:650;font-size:13px;padding:5px 12px;border:1px solid var(--border);border-radius:999px;background:#fff}
.stat-pill.hearts{color:var(--red)} .stat-pill.xp{color:var(--orange)} .stat-pill.streak{color:var(--purple)}
.stat-pill .icon{font-size:15px;line-height:1}

/* ---------- Level map ---------- */
.map-container{max-width:720px;margin:0 auto;padding:32px 20px 100px}
.map-path{display:flex;flex-direction:column;align-items:center}
.level-node{position:relative;margin-bottom:28px;z-index:1}
.level-btn{width:68px;height:68px;border-radius:50%;border:1px solid var(--border);cursor:pointer;font-size:26px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center;position:relative;transition:transform .15s ease,box-shadow .15s ease;box-shadow:var(--shadow)}
.level-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.level-btn:active:not(:disabled){transform:translateY(0)}
.level-btn.completed{background:var(--primary);border-color:var(--primary-dark)}
.level-btn.current{background:var(--gold);border-color:#ad8220;animation:pulse 2s ease-in-out infinite}
.level-btn.locked{background:#dde3dd;border-color:#c8d0c8;color:#8b9990;cursor:not-allowed}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(201,154,46,.45)}70%{box-shadow:0 0 0 10px rgba(201,154,46,0)}}
.level-btn .star-badge{position:absolute;top:-7px;right:-7px;background:var(--blue);color:#fff;border-radius:999px;padding:1px 7px;font-size:11px;font-weight:700;border:2px solid #fff}
.level-btn .lock-icon{font-size:22px;opacity:.75}
.connector{width:2px;height:24px;background:var(--border);margin:-14px 0;border-radius:2px}
.connector.done{background:var(--primary)}
.level-label{position:absolute;left:88px;top:50%;transform:translateY(-50%);white-space:nowrap}
.level-label .name{font-size:15px;font-weight:650}
.level-label .desc{font-size:12.5px;color:var(--text-light);margin-top:2px}
.level-label .tag{display:inline-block;font-size:11px;font-weight:650;padding:1px 8px;border-radius:999px;margin-top:5px}
.tag-easy{background:var(--primary-light);color:var(--primary-dark)}
.tag-medium{background:var(--gold-light);color:var(--orange)}
.tag-hard{background:var(--orange-light);color:#8a4a10}
.tag-boss{background:var(--purple-light);color:var(--purple)}
.level-node:nth-child(even) .level-label{left:auto;right:88px;text-align:right}

/* ---------- Quiz overlay ---------- */
.quiz-overlay{position:fixed;inset:0;background:rgba(24,45,42,.38);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.quiz-overlay.active{display:flex}
.quiz-card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius-lg);max-width:660px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:slideUp .22s ease}
@keyframes slideUp{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
.quiz-header{padding:14px 22px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;background:var(--card-bg);z-index:1}
.quiz-header .progress-bar{flex:1;height:6px;background:var(--surface-sunk);border-radius:999px;overflow:hidden}
.quiz-header .progress-fill{height:100%;background:var(--primary);border-radius:999px;transition:width .3s ease}
.quiz-header .close-btn{background:none;border:0;font-size:20px;cursor:pointer;color:var(--text-light);padding:4px 8px;border-radius:var(--radius-sm);line-height:1}
.quiz-header .close-btn:hover{background:var(--surface-soft);color:var(--text)}
.quiz-body{padding:24px 22px}
.question-type{font-size:11.5px;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.question-text{font-size:19px;font-weight:650;line-height:1.5;margin-bottom:22px;letter-spacing:-.01em}
.options{display:flex;flex-direction:column;gap:10px}
.option-btn{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border:1px solid var(--border);border-radius:var(--radius);background:#fff;cursor:pointer;font-size:15px;font-weight:500;color:var(--text);transition:border-color .12s ease,background .12s ease;text-align:left;line-height:1.55}
.option-btn:hover{border-color:var(--primary);background:var(--surface-soft)}
.option-btn .opt-key{width:26px;height:26px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;color:var(--text-light);flex-shrink:0;background:#fff;margin-top:1px}
.option-btn.selected{border-color:var(--primary);background:var(--surface-soft)}
.option-btn.selected .opt-key{border-color:var(--primary);background:var(--primary);color:#fff}
.option-btn.correct{border-color:var(--primary);background:var(--primary-light)}
.option-btn.correct .opt-key{border-color:var(--primary);background:var(--primary);color:#fff}
.option-btn.wrong{border-color:var(--red);background:var(--red-light)}
.option-btn.wrong .opt-key{border-color:var(--red);background:var(--red);color:#fff}
.text-input{width:100%;padding:14px 16px;border:1px solid var(--border);border-radius:var(--radius);font-size:15px;font-family:inherit;min-height:110px;resize:vertical;transition:border-color .12s ease;line-height:1.6;background:#fff;color:var(--text)}
.text-input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
.true-false{display:flex;gap:10px}
.true-false .option-btn{flex:1;justify-content:center;align-items:center}

/* ---------- Feedback ---------- */
.feedback{margin-top:20px;padding:16px 18px;border-radius:var(--radius);display:none;border:1px solid transparent}
.feedback.show{display:block;animation:slideUp .18s ease}
.feedback.correct{background:var(--primary-light);border-color:#b9d4bf}
.feedback.wrong{background:var(--red-light);border-color:#e6c3c3}
.feedback .result-icon{font-size:15px;font-weight:700;margin-bottom:8px}
.feedback.correct .result-icon{color:var(--primary-dark)}
.feedback.wrong .result-icon{color:var(--red-dark)}
.feedback .explanation{font-size:14.5px;line-height:1.7}
.feedback .explanation strong{color:var(--text);font-weight:700}

/* ---------- Footer and buttons ---------- */
.quiz-footer{padding:14px 22px;border-top:1px solid var(--line-soft);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;bottom:0;background:var(--card-bg)}
.btn{padding:11px 26px;border:1px solid transparent;border-radius:var(--radius);font-size:15px;font-weight:700;cursor:pointer;transition:background .12s ease,transform .08s ease}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-primary:disabled{background:#dde3dd;color:#8b9990;cursor:not-allowed}

/* ---------- Victory ---------- */
.victory-overlay{position:fixed;inset:0;background:rgba(24,45,42,.45);z-index:300;display:none;align-items:center;justify-content:center}
.victory-overlay.active{display:flex}
.victory-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);padding:36px;max-width:400px;width:90%;text-align:center;animation:bi .35s ease;box-shadow:var(--shadow-lg)}
@keyframes bi{0%{transform:scale(.94);opacity:0}100%{transform:scale(1);opacity:1}}
.victory-card .trophy{font-size:56px;margin-bottom:12px}
.victory-card h2{font-size:22px;font-weight:700;margin-bottom:6px;letter-spacing:-.01em}
.victory-card .subtitle{font-size:14px;color:var(--text-light);margin-bottom:24px}
.victory-card .rewards{display:flex;justify-content:center;gap:28px;margin-bottom:26px}
.reward-item{display:flex;flex-direction:column;align-items:center;gap:2px}
.reward-item .reward-icon{font-size:26px}
.reward-item .reward-val{font-size:18px;font-weight:700}
.reward-item .reward-label{font-size:11.5px;color:var(--text-light)}

/* ---------- Toast ---------- */
.achievement-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--text);color:#fff;padding:11px 20px;border-radius:999px;font-weight:650;font-size:14px;z-index:400;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:8px;transition:transform .25s ease}
.achievement-toast.show{transform:translateX(-50%) translateY(0)}

/* ---------- Start screen ---------- */
.start-screen{text-align:center;padding:56px 20px;max-width:620px;margin:0 auto}
.start-screen .hero-icon{font-size:60px;margin-bottom:12px}
.start-screen h1{font-size:27px;font-weight:700;margin-bottom:6px;letter-spacing:-.02em}
.start-screen .subtitle{font-size:15px;color:var(--text-light);margin-bottom:28px}
.start-screen .player-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:22px;text-align:left}
.start-screen .player-card .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line-soft)}
.start-screen .player-card .row:last-child{border-bottom:none}
.start-screen .player-card .label{color:var(--text-light);font-size:14px}
.start-screen .player-card .value{font-weight:650;font-size:14px}
.tip-bubble{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;font-size:14px;color:var(--text-light);margin:16px 0}
.tip-bubble::before{content:'\1F4A1';margin-right:6px}

/* ---------- Responsive ---------- */
@media(max-width:480px){
  .level-label .desc{display:none}
  .level-btn{width:56px;height:56px;font-size:22px}
  .question-text{font-size:17px}
  .top-bar .title{font-size:14px}
  .stat-pill{font-size:12px;padding:4px 9px}
  .quiz-body{padding:18px 16px}
}
